/* =========================================================================
   Education Leadership English Hub — styles.css
   Executive design system: deep navy, soft-shadow cards, light + dark modes.
   ========================================================================= */

/* ---------- Design tokens ---------- */
:root {
  --navy-900: #0b1e3b;
  --navy-800: #102a52;
  --navy-700: #16386b;
  --navy-600: #1e4a8a;
  --navy-500: #2a5ca8;
  --accent: #c9a227;        /* subtle gold accent */
  --accent-soft: #e7d59a;
  --teal: #1f9e8f;
  --rose: #d1495b;
  --amber: #e9a53f;
  --green: #2f9e44;

  --bg: #eef2f7;
  --surface: #ffffff;
  --surface-2: #f6f8fb;
  --border: #dbe3ee;
  --text: #12233d;
  --text-soft: #5a6b82;
  --text-faint: #8a99ad;
  --shadow: 0 6px 24px rgba(16, 42, 82, 0.08);
  --shadow-lg: 0 14px 40px rgba(16, 42, 82, 0.14);
  --radius: 16px;
  --radius-sm: 10px;
  --sidebar-w: 248px;
  --focus: #2a5ca8;
  --font: "Inter", "Segoe UI", system-ui, -apple-system, Roboto, Arial, sans-serif;
}

[data-theme="dark"] {
  --bg: #0a1526;
  --surface: #0f2140;
  --surface-2: #12294c;
  --border: #21375c;
  --text: #e8eef7;
  --text-soft: #a9bad4;
  --text-faint: #6f83a3;
  --shadow: 0 6px 24px rgba(0, 0, 0, 0.35);
  --shadow-lg: 0 14px 40px rgba(0, 0, 0, 0.5);
  --navy-900: #0a1526;
}

* { box-sizing: border-box; }

html { scroll-behavior: smooth; }
[data-reduce-motion="true"] * {
  animation-duration: 0.001ms !important;
  transition-duration: 0.001ms !important;
  scroll-behavior: auto !important;
}

body {
  margin: 0;
  font-family: var(--font);
  background: var(--bg);
  color: var(--text);
  font-size: 15px;
  line-height: 1.55;
  -webkit-font-smoothing: antialiased;
}

h1, h2, h3, h4 { color: var(--text); line-height: 1.25; margin: 0 0 .4em; font-weight: 700; }
h1 { font-size: 1.5rem; }
h2 { font-size: 1.2rem; }
h3 { font-size: 1rem; }
p { margin: 0 0 .8em; }
a { color: var(--navy-500); }
[data-theme="dark"] a { color: #8fb4e8; }

/* ---------- App shell ---------- */
.app { display: flex; min-height: 100vh; }

.sidebar {
  width: var(--sidebar-w);
  background: linear-gradient(180deg, var(--navy-900), var(--navy-800));
  color: #dfe8f5;
  position: fixed;
  inset: 0 auto 0 0;
  display: flex;
  flex-direction: column;
  z-index: 40;
  transition: transform .25s ease;
}
.brand {
  padding: 20px 20px 14px;
  border-bottom: 1px solid rgba(255,255,255,.08);
}
.brand .logo {
  display: flex; align-items: center; gap: 10px;
  font-weight: 800; font-size: 1.02rem; color: #fff; letter-spacing: .2px;
}
.brand .logo .mark {
  width: 34px; height: 34px; border-radius: 9px;
  background: linear-gradient(135deg, var(--accent), var(--accent-soft));
  color: var(--navy-900); display: grid; place-items: center; font-weight: 900;
  flex: 0 0 auto;
}
.brand .sub { font-size: .72rem; color: #9db4d6; margin-top: 4px; }

.nav { flex: 1; overflow-y: auto; padding: 10px 10px 20px; }
.nav::-webkit-scrollbar { width: 8px; }
.nav::-webkit-scrollbar-thumb { background: rgba(255,255,255,.12); border-radius: 8px; }
.nav-item {
  display: flex; align-items: center; gap: 11px;
  padding: 9px 12px; border-radius: 10px; color: #c4d3e9;
  cursor: pointer; font-size: .88rem; font-weight: 500;
  border: none; background: none; width: 100%; text-align: left;
  transition: background .15s, color .15s;
}
.nav-item .ico { width: 18px; text-align: center; opacity: .9; font-size: .95rem; }
.nav-item:hover { background: rgba(255,255,255,.07); color: #fff; }
.nav-item.active { background: var(--navy-600); color: #fff; box-shadow: inset 3px 0 0 var(--accent); }
.nav-section { font-size: .66rem; text-transform: uppercase; letter-spacing: .12em; color: #6d84a8; padding: 14px 12px 6px; }
/* Collapsible add-on section header */
.nav-toggle {
  display: flex; align-items: center; justify-content: space-between; gap: 8px;
  width: 100%; background: none; border: none; cursor: pointer;
  font-family: inherit; text-align: left; margin-top: 4px; border-radius: 8px;
  transition: color .15s, background .15s;
}
.nav-toggle:hover { color: #c4d3e9; background: rgba(255,255,255,.05); }
.nav-toggle .caret { font-size: .7rem; transition: transform .2s; }
.nav-toggle.collapsed .caret { transform: rotate(-90deg); }
.nav-group { display: flex; flex-direction: column; overflow: hidden; }
.nav-group.collapsed { display: none; }

.main {
  flex: 1;
  margin-left: var(--sidebar-w);
  min-width: 0;
  display: flex; flex-direction: column;
}

/* ---------- Topbar ---------- */
.topbar {
  position: sticky; top: 0; z-index: 30;
  display: flex; align-items: center; gap: 14px;
  padding: 12px 26px;
  background: color-mix(in srgb, var(--surface) 88%, transparent);
  backdrop-filter: blur(10px);
  border-bottom: 1px solid var(--border);
}
.topbar .page-title { font-size: 1.12rem; font-weight: 700; margin: 0; }
.topbar .spacer { flex: 1; }
.icon-btn {
  border: 1px solid var(--border); background: var(--surface);
  color: var(--text); width: 38px; height: 38px; border-radius: 10px;
  cursor: pointer; font-size: 1rem; display: grid; place-items: center;
  transition: background .15s, transform .1s;
}
.icon-btn:hover { background: var(--surface-2); }
.icon-btn:active { transform: scale(.95); }
.menu-toggle { display: none; }

.pill {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 5px 11px; border-radius: 999px; font-size: .76rem; font-weight: 600;
  background: var(--surface-2); border: 1px solid var(--border); color: var(--text-soft);
}
.pill.level { background: linear-gradient(135deg, var(--navy-600), var(--navy-500)); color: #fff; border: none; }
.pill.streak { color: var(--amber); }

/* ---------- Content ---------- */
.content { padding: 26px; max-width: 1240px; width: 100%; margin: 0 auto; }
.view { display: none; animation: fade .3s ease; }
.view.active { display: block; }
@keyframes fade { from { opacity: 0; transform: translateY(6px);} to { opacity:1; transform:none;} }

.section-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; margin-bottom: 16px; flex-wrap: wrap; }
.section-head p { color: var(--text-soft); margin: 2px 0 0; font-size: .9rem; max-width: 640px; }

/* ---------- Cards & grid ---------- */
.grid { display: grid; gap: 16px; }
.grid.cols-2 { grid-template-columns: repeat(2, 1fr); }
.grid.cols-3 { grid-template-columns: repeat(3, 1fr); }
.grid.cols-4 { grid-template-columns: repeat(4, 1fr); }
.grid.auto { grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); }

.card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 18px;
  box-shadow: var(--shadow);
}
.card.glass {
  background: color-mix(in srgb, var(--surface) 82%, transparent);
  backdrop-filter: blur(8px);
}
.card h3 { margin-bottom: .6em; }
.card .card-sub { color: var(--text-faint); font-size: .78rem; margin-top: -4px; }

.stat {
  display: flex; flex-direction: column; gap: 2px;
}
.stat .num { font-size: 1.9rem; font-weight: 800; color: var(--text); letter-spacing: -.5px; }
.stat .lbl { font-size: .78rem; color: var(--text-soft); text-transform: uppercase; letter-spacing: .05em; }
.stat .ico-badge {
  width: 40px; height: 40px; border-radius: 11px; display: grid; place-items: center;
  font-size: 1.1rem; margin-bottom: 8px;
}

/* KPI band on dashboard */
.kpi-band { display: grid; grid-template-columns: repeat(4,1fr); gap: 14px; }
.kpi {
  background: var(--surface); border: 1px solid var(--border); border-radius: 14px;
  padding: 15px 16px; box-shadow: var(--shadow); position: relative; overflow: hidden;
}
.kpi::after { content:""; position:absolute; right:-18px; top:-18px; width:70px; height:70px; border-radius:50%; background: var(--surface-2); }
.kpi .num { font-size: 1.7rem; font-weight: 800; }
.kpi .lbl { color: var(--text-soft); font-size: .76rem; }

/* ---------- Progress bars ---------- */
.bar { height: 8px; background: var(--surface-2); border-radius: 999px; overflow: hidden; }
.bar > span { display: block; height: 100%; border-radius: 999px; background: linear-gradient(90deg, var(--navy-500), var(--teal)); transition: width .8s cubic-bezier(.2,.7,.3,1); }
.bar.sm { height: 6px; }

.indicator-row { display: flex; align-items: center; gap: 12px; padding: 9px 0; border-bottom: 1px dashed var(--border); }
.indicator-row:last-child { border-bottom: none; }
.indicator-row .name { flex: 0 0 190px; font-size: .85rem; font-weight: 600; }
.indicator-row .bar { flex: 1; }
.indicator-row .val { flex: 0 0 96px; text-align: right; font-size: .82rem; color: var(--text-soft); font-variant-numeric: tabular-nums; }
.trend-up { color: var(--green); font-weight: 700; }
.trend-down { color: var(--rose); font-weight: 700; }
.trend-flat { color: var(--text-faint); }

/* ---------- Circular indicators ---------- */
.ring { --p: 0; --size: 116px; --track: var(--surface-2); --fill: var(--navy-500);
  width: var(--size); height: var(--size); border-radius: 50%;
  display: grid; place-items: center; flex: 0 0 auto;
  background: conic-gradient(var(--fill) calc(var(--p)*1%), var(--track) 0);
  transition: background 1s ease;
}
.ring .inner {
  width: calc(var(--size) - 22px); height: calc(var(--size) - 22px);
  background: var(--surface); border-radius: 50%; display: grid; place-items: center; text-align: center;
}
.ring .inner b { font-size: 1.4rem; }
.ring .inner small { display: block; font-size: .64rem; color: var(--text-soft); text-transform: uppercase; letter-spacing: .05em; }

/* ---------- Buttons ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  padding: 9px 16px; border-radius: 10px; font-size: .86rem; font-weight: 600;
  border: 1px solid var(--border); background: var(--surface); color: var(--text);
  cursor: pointer; transition: background .15s, transform .08s, box-shadow .15s;
}
.btn:hover { background: var(--surface-2); }
.btn:active { transform: translateY(1px); }
.btn.primary { background: linear-gradient(135deg, var(--navy-600), var(--navy-500)); color: #fff; border: none; box-shadow: 0 4px 14px rgba(30,74,138,.35); }
.btn.primary:hover { filter: brightness(1.06); }
.btn.gold { background: linear-gradient(135deg, var(--accent), #d9b94a); color: var(--navy-900); border: none; }
.btn.ghost { background: transparent; }
.btn.danger { color: var(--rose); border-color: color-mix(in srgb, var(--rose) 40%, var(--border)); }
.btn.sm { padding: 6px 11px; font-size: .78rem; }
.btn.block { width: 100%; }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.btn-row { display: flex; gap: 10px; flex-wrap: wrap; }

/* ---------- Tags / chips ---------- */
.chip {
  display: inline-flex; align-items: center; gap: 5px;
  padding: 3px 10px; border-radius: 999px; font-size: .72rem; font-weight: 600;
  background: var(--surface-2); color: var(--text-soft); border: 1px solid var(--border);
  cursor: pointer;
}
.chip.on { background: var(--navy-600); color: #fff; border-color: transparent; }
.chip-row { display: flex; gap: 8px; flex-wrap: wrap; }
.tag { font-size: .68rem; padding: 2px 8px; border-radius: 6px; background: var(--surface-2); color: var(--text-soft); font-weight: 600; }
.tag.formal { background: color-mix(in srgb, var(--navy-500) 15%, transparent); color: var(--navy-500); }
.tag.diplomatic { background: color-mix(in srgb, var(--teal) 18%, transparent); color: var(--teal); }
.tag.new { background: color-mix(in srgb, var(--accent) 22%, transparent); color: #9a7d13; }

/* ---------- Flashcards ---------- */
.flashcard {
  perspective: 1400px; height: 300px; cursor: pointer; margin: 0 auto; max-width: 560px;
}
.flashcard-inner { position: relative; width: 100%; height: 100%; transition: transform .6s; transform-style: preserve-3d; }
.flashcard.flipped .flashcard-inner { transform: rotateY(180deg); }
.flash-face {
  position: absolute; inset: 0; backface-visibility: hidden;
  border-radius: var(--radius); border: 1px solid var(--border); background: var(--surface);
  padding: 24px; display: flex; flex-direction: column; box-shadow: var(--shadow);
  overflow: auto;
}
.flash-face.back { transform: rotateY(180deg); background: var(--surface-2); }
.flash-face .term { font-size: 1.6rem; font-weight: 800; }
.flash-face .pron { color: var(--text-soft); font-style: italic; }
.flash-face .pos { font-size: .74rem; text-transform: uppercase; letter-spacing: .06em; color: var(--accent); font-weight: 700; }

/* ---------- Forms ---------- */
label.field { display: block; margin-bottom: 12px; }
label.field > span { display: block; font-size: .8rem; font-weight: 600; margin-bottom: 5px; color: var(--text-soft); }
input[type=text], input[type=number], input[type=time], input[type=url], input[type=password], select, textarea {
  width: 100%; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--border);
  background: var(--surface); color: var(--text); font-family: inherit; font-size: .88rem;
}
textarea { resize: vertical; min-height: 90px; }
input:focus, select:focus, textarea:focus { outline: 2px solid var(--focus); outline-offset: 1px; border-color: transparent; }
.switch { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; }
.switch input { display: none; }
.switch .track { width: 40px; height: 22px; border-radius: 999px; background: var(--border); position: relative; transition: background .2s; }
.switch .track::after { content:""; position:absolute; top:2px; left:2px; width:18px; height:18px; border-radius:50%; background:#fff; transition: transform .2s; box-shadow: 0 1px 3px rgba(0,0,0,.3); }
.switch input:checked + .track { background: var(--navy-500); }
.switch input:checked + .track::after { transform: translateX(18px); }

/* ---------- Tables ---------- */
table.data { width: 100%; border-collapse: collapse; font-size: .85rem; }
table.data th, table.data td { text-align: left; padding: 9px 10px; border-bottom: 1px solid var(--border); }
table.data th { color: var(--text-soft); font-size: .74rem; text-transform: uppercase; letter-spacing: .05em; }

/* ---------- Chat / simulator ---------- */
.chat { display: flex; flex-direction: column; gap: 10px; max-height: 420px; overflow-y: auto; padding: 4px; }
.bubble { max-width: 78%; padding: 10px 14px; border-radius: 14px; font-size: .88rem; line-height: 1.45; }
.bubble.them { align-self: flex-start; background: var(--surface-2); border: 1px solid var(--border); border-bottom-left-radius: 4px; }
.bubble.me { align-self: flex-end; background: linear-gradient(135deg, var(--navy-600), var(--navy-500)); color: #fff; border-bottom-right-radius: 4px; }
.bubble .who { font-size: .68rem; font-weight: 700; opacity: .7; display: block; margin-bottom: 2px; }

/* ---------- Teleprompter ---------- */
.teleprompter {
  background: #06101f; color: #eaf1fb; border-radius: var(--radius); padding: 30px;
  font-size: 2rem; line-height: 1.6; height: 340px; overflow: hidden; position: relative;
}
.teleprompter .scroll { transition: transform .1s linear; }
.teleprompter .emph { color: var(--accent-soft); font-weight: 700; }
.teleprompter .pause { color: #6f9; }

/* ---------- Misc ---------- */
.muted { color: var(--text-soft); }
.faint { color: var(--text-faint); }
.small { font-size: .8rem; }
.center { text-align: center; }
.mt { margin-top: 14px; } .mt2 { margin-top: 22px; }
.mb { margin-bottom: 14px; }
.flex { display: flex; gap: 12px; align-items: center; }
.flex.wrap { flex-wrap: wrap; }
.between { justify-content: space-between; }
.divider { height: 1px; background: var(--border); margin: 16px 0; border: none; }
.badge-score { font-weight: 800; font-size: 1.1rem; }
.hl { background: color-mix(in srgb, var(--accent) 30%, transparent); border-radius: 4px; padding: 0 3px; }
.err-word { color: var(--rose); text-decoration: underline wavy var(--rose); }

.empty {

  border: 2px dashed var(--border); border-radius: var(--radius);
}
.empty .big { font-size: 2.2rem; margin-bottom: 8px; }

.loader { display: inline-block; width: 18px; height: 18px; border: 3px solid var(--border); border-top-color: var(--navy-500); border-radius: 50%; animation: spin .8s linear infinite; }

.toast-wrap { position: fixed; bottom: 22px; right: 22px; z-index: 100; display: flex; flex-direction: column; gap: 10px; }
.toast { background: var(--navy-800); color: #fff; padding: 12px 16px; border-radius: 12px; box-shadow: var(--shadow-lg); font-size: .85rem; animation: fade .25s ease; max-width: 320px; }
.toast.good { background: var(--green); }
.toast.warn { background: var(--amber); color: #2a2000; }
.toast.bad { background: var(--rose); }

.modal-backdrop { position: fixed; inset: 0; background: rgba(6,16,31,.55); backdrop-filter: blur(3px); z-index: 90; display: none; place-items: center; padding: 20px; }
.modal-backdrop.open { display: grid; }
.modal { background: var(--surface); border-radius: var(--radius); box-shadow: var(--shadow-lg); max-width: 560px; width: 100%; max-height: 88vh; overflow: auto; padding: 22px; }

/* Progress path / stages */
.stage-track { display: flex; gap: 0; margin: 8px 0 4px; }
.stage-node { flex: 1; text-align: center; position: relative; }
.stage-node .dot { width: 26px; height: 26px; border-radius: 50%; background: var(--surface-2); border: 2px solid var(--border); margin: 0 auto 6px; display: grid; place-items: center; font-size: .7rem; font-weight: 700; }
.stage-node.done .dot { background: var(--green); border-color: var(--green); color: #fff; }
.stage-node.current .dot { background: var(--navy-500); border-color: var(--navy-500); color: #fff; box-shadow: 0 0 0 4px color-mix(in srgb, var(--navy-500) 25%, transparent); }
.stage-node::before { content:""; position:absolute; top:12px; left:-50%; width:100%; height:2px; background: var(--border); z-index:-0; }
.stage-node:first-child::before { display:none; }
.stage-node.done::before, .stage-node.current::before { background: var(--green); }
.stage-node small { font-size: .68rem; color: var(--text-soft); }

  <script>
/* =========================================================================
   Education Leadership English Hub — app.js
   Vanilla JS single-page application logic.
   Sections: state/storage, adaptive engine, scoring, speech, router, views.
   Works fully offline in demo mode. Optional AI hooks are clearly marked.
   ========================================================================= */
(function () {
  "use strict";
  var D = window.HUB_DATA;
  var $ = function (sel, root) { return (root || document).querySelector(sel); };
  var $$ = function (sel, root) { return Array.prototype.slice.call((root || document).querySelectorAll(sel)); };
  var el = function (tag, attrs, html) {
    var e = document.createElement(tag);
    if (attrs) for (var k in attrs) { if (k === "class") e.className = attrs[k]; else if (k === "html") e.innerHTML = attrs[k]; else e.setAttribute(k, attrs[k]); }
    if (html != null) e.innerHTML = html;
    return e;
  };
  var esc = function (s) { return String(s == null ? "" : s).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); };
  var todayStr = function () { return new Date().toISOString().slice(0, 10); };
  var clamp = function (n, a, b) { return Math.max(a, Math.min(b, n)); };

  /* ---------------------------------------------------------------------
     STATE & STORAGE
     Primary store: localStorage (key below). Large records could be moved
     to IndexedDB; a minimal IndexedDB backup helper is included at the end.
  --------------------------------------------------------------------- */
  var STORE_KEY = "elh_state_v1";

  function defaultState() {
    var indicators = {};
    D.INDICATORS.forEach(function (i) {
      var base = 55 + Math.round(Math.abs(hash(i.key)) % 18); // 55-72 starting band
      indicators[i.key] = { current: base, previous: base, target: 90 };
    });
    return {
      profile: { name: "Education Leader", level: "B2", target: "C1" },
      indicators: indicators,
      streak: { count: 0, last: null },
      totals: { timeMin: 0, lessons: 0, words: 0, phrases: 0, speaking: 0, negotiations: 0, speeches: 0 },
      vocab: {},          // term -> {mastery, ease, interval, due, reps}
      savedPhrases: [],   // phrase strings / custom items
      goals: [],
      weekly: [],         // weekly reports
      imported: [],
      activity: [],       // {date, type, score, note}
      todayDonePlan: {},  // date -> [stepIndex...]
      settings: {
        theme: "light", uz: false, reduceMotion: false, dailyLength: 30,
        refreshTime: "07:00",
        sources: [
          { name: "OECD Education", url: "https://www.oecd.org/education/", active: true },
          { name: "UNESCO", url: "https://www.unesco.org/en/education", active: true },
          { name: "ENQA", url: "https://www.enqa.eu/", active: true }
        ],
        aiKeyConfigured: false
      },
      feed: null,
      installedDay: todayStr()
    };
  }

  function hash(s) { var h = 0; for (var i = 0; i < s.length; i++) { h = (h << 5) - h + s.charCodeAt(i); h |= 0; } return h; }

  var S;
  function load() {
    try { S = JSON.parse(localStorage.getItem(STORE_KEY)) || defaultState(); }
    catch (e) { S = defaultState(); }
    // merge any new default keys (forward compatibility)
    var d = defaultState();
    for (var k in d) if (!(k in S)) S[k] = d[k];
    if (!S.settings) S.settings = d.settings;
    for (var sk in d.settings) if (!(sk in S.settings)) S.settings[sk] = d.settings[sk];
  }
  var saveTimer;
  function save() {
    clearTimeout(saveTimer);
    saveTimer = setTimeout(function () {
      try { localStorage.setItem(STORE_KEY, JSON.stringify(S)); }
      catch (e) { toast("Storage full — export a backup to be safe.", "warn"); }
    }, 120);
  }

  /* ---------------------------------------------------------------------
     ADAPTIVE ENGINE & SCORING
  --------------------------------------------------------------------- */
  // Record an activity result and nudge related indicators.
  function recordActivity(type, score, indicatorKeys, note) {
    S.activity.unshift({ date: todayStr(), ts: Date.now(), type: type, score: score, note: note || "" });
    S.activity = S.activity.slice(0, 400);
    (indicatorKeys || []).forEach(function (key) {
      var ind = S.indicators[key];
      if (!ind) return;
      ind.previous = ind.current;
      // move current 25% toward the new score
      ind.current = clamp(Math.round(ind.current + (score - ind.current) * 0.25), 0, 100);
    });
    bumpStreak();
    save();
  }

  function bumpStreak() {
    var t = todayStr();
    if (S.streak.last === t) return;
    var yest = new Date(Date.now() - 864e5).toISOString().slice(0, 10);
    S.streak.count = (S.streak.last === yest) ? S.streak.count + 1 : 1;
    S.streak.last = t;
  }

  function overallScore() {
    var keys = Object.keys(S.indicators), sum = 0;
    keys.forEach(function (k) { sum += S.indicators[k].current; });
    return Math.round(sum / keys.length);
  }
  function growthScore() {
    // professional growth = overall + streak + mastery bonuses
    var base = overallScore();
    var bonus = Math.min(8, S.streak.count) + Math.min(6, Math.floor(S.totals.words / 20)) + Math.min(6, S.totals.speaking);
    return clamp(base + bonus - 5, 0, 100);
  }
  function weakestIndicators(n) {
    return D.INDICATORS.slice().sort(function (a, b) { return S.indicators[a.key].current - S.indicators[b.key].current; }).slice(0, n || 3);
  }
  function strongestIndicators(n) {
    return D.INDICATORS.slice().sort(function (a, b) { return S.indicators[b.key].current - S.indicators[a.key].current; }).slice(0, n || 3);
  }
  function recommendationReason(ind) {
    var v = S.indicators[ind.key].current;
    if (v < 60) return "Score " + v + " — below 60, so intensive practice is recommended.";
    if (v < 75) return "Score " + v + " — regular reinforcement will consolidate this.";
    if (v < 90) return "Score " + v + " — advanced application to push toward C1.";
    return "Score " + v + " — strong; maintenance and challenge tasks.";
  }

  // Rule-based speaking/writing scorer (used when no AI configured)
  function scoreResponse(text, opts) {
    opts = opts || {};
    var words = (text.trim().match(/\b[\w'-]+\b/g) || []);
    var wc = words.length;
    var lower = text.toLowerCase();
    var fillers = (lower.match(/\b(um|uh|erm|like|you know|basically|actually|sort of|kind of)\b/g) || []);
    var expected = opts.expected || [];
    var hits = expected.filter(function (t) { return lower.indexOf(t.toLowerCase()) >= 0; });
    var sentences = (text.match(/[.!?]+/g) || []).length || 1;
    var avgSent = wc / sentences;
    // repeated words (content words repeated a lot)
    var freq = {}; words.forEach(function (w) { w = w.toLowerCase(); if (w.length > 4) freq[w] = (freq[w] || 0) + 1; });
    var repeated = Object.keys(freq).filter(function (w) { return freq[w] >= 4; });

    var lengthScore = clamp((wc / (opts.targetWords || 90)) * 100, 0, 100);
    var termScore = expected.length ? Math.round((hits.length / expected.length) * 100) : clamp(wc, 0, 100);
    var fillerPenalty = Math.min(30, fillers.length * 6);
    var structureScore = clamp(100 - Math.abs(avgSent - 16) * 3, 40, 100);
    var fluency = clamp(Math.round(lengthScore * 0.6 + structureScore * 0.4 - fillerPenalty), 0, 100);
    var overall = clamp(Math.round(fluency * 0.4 + termScore * 0.4 + structureScore * 0.2), 0, 100);

    return {
      wc: wc, fillers: fillers, fillerCount: fillers.length, hits: hits, missed: expected.filter(function (t) { return hits.indexOf(t) < 0; }),
      repeated: repeated, avgSent: Math.round(avgSent), fluency: fluency, terminology: termScore,
      structure: Math.round(structureScore), overall: overall,
      wpm: opts.seconds ? Math.round(wc / (opts.seconds / 60)) : null
    };
  }

  /* ---------------------------------------------------------------------
     SPACED REPETITION (SM-2 lite)
  --------------------------------------------------------------------- */
  function vocabState(term) {
    if (!S.vocab[term]) S.vocab[term] = { mastery: "new", ease: 2.5, interval: 0, due: todayStr(), reps: 0 };
    return S.vocab[term];
  }
  function reviewVocab(term, quality) { // quality 0..5
    var v = vocabState(term);
    if (quality < 3) { v.reps = 0; v.interval = 1; }
    else {
      v.reps += 1;
      if (v.reps === 1) v.interval = 1; else if (v.reps === 2) v.interval = 6;
      else v.interval = Math.round(v.interval * v.ease);
      v.ease = clamp(v.ease + (0.1 - (5 - quality) * (0.08 + (5 - quality) * 0.02)), 1.3, 3.0);
    }
    v.due = new Date(Date.now() + v.interval * 864e5).toISOString().slice(0, 10);
    v.mastery = v.reps >= 4 && quality >= 4 ? "mastered" : (quality >= 3 ? "learning" : "difficult");
    if (v.mastery === "mastered") { S.totals.words = countMastered(); }
    save();
  }
  function countMastered() { return Object.keys(S.vocab).filter(function (t) { return S.vocab[t].mastery === "mastered"; }).length; }
  function dueVocab() {
    var t = todayStr();
    return D.VOCABULARY.filter(function (v) { var st = S.vocab[v.term]; return !st || st.due <= t; });
  }

  /* ---------------------------------------------------------------------
     UI HELPERS: toast, modal, tts, timer
  --------------------------------------------------------------------- */
  function toast(msg, kind) {
    var wrap = $("#toasts");
    var t = el("div", { class: "toast " + (kind || "") }, esc(msg));
    wrap.appendChild(t);
    setTimeout(function () { t.style.opacity = "0"; setTimeout(function () { t.remove(); }, 300); }, 2600);
  }
  function modal(html) {
    var b = $("#modal-backdrop");
    $("#modal-body").innerHTML = html;
    b.classList.add("open");
  }
  function closeModal() { $("#modal-backdrop").classList.remove("open"); }

  var synth = window.speechSynthesis;
  function speak(text, rate) {
    if (!synth) { toast("Text-to-speech not supported in this browser.", "warn"); return; }
    synth.cancel();
    var u = new SpeechSynthesisUtterance(text);
    u.rate = rate || 1; u.lang = "en-GB";
    synth.speak(u);
  }

  // Speech recognition (where available)
  var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  function makeRecognizer(onResult, onEnd) {
    if (!SR) return null;
    var r = new SR();
    r.lang = "en-GB"; r.interimResults = true; r.continuous = true;
    var finalText = "";
    r.onresult = function (e) {
      var interim = "";
      for (var i = e.resultIndex; i < e.results.length; i++) {
        if (e.results[i].isFinal) finalText += e.results[i][0].transcript + " ";
        else interim += e.results[i][0].transcript;
      }
      onResult(finalText, interim);
    };
    r.onend = function () { onEnd && onEnd(finalText); };
    r._final = function () { return finalText; };
    return r;
  }

  /* ---------------------------------------------------------------------
     ROUTER
  --------------------------------------------------------------------- */
  var VIEWS = {}; // name -> render(container)
  var currentView = "dashboard";
  function navigate(name) {
    if (!VIEWS[name]) name = "dashboard";
    currentView = name;
    $$(".nav-item").forEach(function (b) { b.classList.toggle("active", b.dataset.view === name); });
    var host = $("#view-host");
    host.innerHTML = "";
    var wrap = el("div", { class: "view active" });
    host.appendChild(wrap);
    VIEWS[name](wrap);
    $("#page-title").textContent = NAV_LABEL[name] || "Dashboard";
    document.body.classList.remove("nav-open");
    window.scrollTo(0, 0);
    location.hash = name;
    syncBottom();
  }

  /* ---------- Mobile bottom navigation ---------- */
  var BOTTOM_NAV = [
    ["dashboard", "Home", "🏠"], ["today", "Plan", "📅"], ["speaking", "Speak", "🎙️"],
    ["progress", "Progress", "📈"], ["__menu__", "Menu", "☰"]
  ];
  function buildBottomNav() {
    var bn = $("#bottom-nav"); if (!bn) return;
    bn.innerHTML = "";
    BOTTOM_NAV.forEach(function (it) {

  var NAV = [
    ["dashboard", "Dashboard", "📊"], ["today", "Today’s Plan", "📅"], ["vocab", "Vocabulary", "📚"],
    ["phrases", "Phrase Bank", "💬"], ["speaking", "Speaking Studio", "🎙️"], ["negotiation", "Negotiation", "🤝"],
    ["speeches", "Conference Speeches", "🎤"], ["difficult", "Difficult Questions", "❓"], ["listening", "Listening", "🎧"],
    ["grammar", "Grammar", "✍️"], ["writing", "Writing", "📝"], ["feed", "Knowledge Feed", "📰"],
    ["import", "Content Importer", "📥"], ["assess", "Assessments", "🏅"], ["progress", "Progress", "📈"],

  function ring(pct, label, val) {

  }

  /* ---------------------------------------------------------------------
     VIEW: DASHBOARD
  --------------------------------------------------------------------- */
  VIEWS.dashboard = function (host) {

      kpi("Current level", S.profile.level, "🎓") + kpi("Target", S.profile.target, "🏆") +

      miniStat("Learning time", (t.timeMin) + " min", "⏱️") + miniStat("Lessons", t.lessons, "✅") +

      miniStat("Speaking sessions", t.speaking, "🎙️") + miniStat("Negotiations", t.negotiations, "🤝") +

      '<div class="grid cols-3 mb">' +
      '<div class="card" style="grid-column: span 2"><h3>Professional competencies</h3><div class="card-sub mb">Twelve core indicators — current vs previous vs target (90).</div><div id="ind-list"></div></div>' +
      '<div class="card"><h3>Today at a glance</h3>' +
      dashLine("Topic", plan.topic) + dashLine("Vocabulary target", "10 " + plan.vocab + " terms") +

      '<button class="btn sm" data-go="difficult">Practise it →</button></div>' +
      '</div>' +

      '<div class="grid cols-3">' +

  function modelAnswerFor(task) {

    if (task.title.indexOf("accreditation") >= 0 || task.title === "Two-minute policy explanation")
      return "Accreditation exists to protect public trust. It holds institutions accountable, drives continuous improvement, and gives students and employers confidence that a qualification means what it claims. Through transparent, evidence-based evaluation we make our standards internationally comparable, while respecting institutional autonomy. In short, accreditation is a public promise of quality — and our task is to make that promise deserved.";

      '<div class="small mt"><b>Terms used:</b> ' + (s.hits.length ? s.hits.map(function (h) { return '<span class="good-word">' + esc(h) + '</span>'; }).join(", ") : '<span class="muted">none of the target terms</span>') + '</div>' +
      (s.missed.length ? '<div class="small mt"><b>Try to include:</b> ' + s.missed.map(function (m) { return '<span class="tag">' + esc(m) + '</span>'; }).join(" ") + '</div>' : '') +

  function renderNegRun(host, ses) {
    var n = ses.n;
    host.innerHTML =
      '<div class="section-head"><div><h1>' + esc(n.title) + '</h1><p>Stage ' + (ses.stage + 1) + ' of ' + n.stages.length + ' · ' + esc(n.stages[ses.stage]) + '</p></div><button class="btn ghost" id="neg-exit">Exit</button></div>' +
      '<div class="stage-track mb">' + n.stages.map(function (st, i) { return '<div class="stage-node ' + (i < ses.stage ? "done" : (i === ses.stage ? "current" : "")) + '"><div class="dot">' + (i + 1) + '</div><small>' + esc(st) + '</small></div>'; }).join("") + '</div>' +
      '<div class="grid cols-3"><div class="card" style="grid-column:span 2"><div class="chat" id="neg-chat"></div>' +
      '<div class="mt"><textarea id="neg-input" placeholder="Type your response as the education leader..."></textarea>' +
      '<div class="btn-row mt"><button class="btn primary" id="neg-send">Send</button><button class="btn" id="neg-mic">🎙️</button><button class="btn" id="neg-hint">💡 Useful phrases</button></div></div></div>' +
      '<div class="card"><h3>Your brief</h3><div class="small"><b>Role.</b> ' + esc(n.role) + '</div>' +
      '<div class="small mt"><b>Objectives.</b><ul style="margin:4px 0 0 18px">' + n.objectives.map(function (o) { return "<li>" + esc(o) + "</li>"; }).join("") + '</ul></div>' +
      '<div class="small mt"><b>Confidential priorities.</b> ' + n.priorities.map(esc).join(" ") + '</div>' +
      '<div class="small mt"><b>Likely objections.</b> ' + n.objections.map(function (o) { return '“' + esc(o) + '”'; }).join(" ") + '</div></div></div>';

    var chat = $("#neg-chat", host);
    if (!ses.log.length) pushBubble(chat, ses, "them", n.counterpart, n.openings[0]);
    else ses.log.forEach(function (m) { pushBubble(chat, ses, m.side, m.who, m.text, true); });

    $("#neg-exit", host).onclick = function () { finishNegotiation(ses); };
    $("#neg-hint", host).onclick = function () { modal('<h3>Useful phrases</h3>' + n.phrases.map(function (p) { return '<p>“' + esc(p) + '”</p>'; }).join("") + '<div class="center"><button class="btn" onclick="document.getElementById(\'modal-backdrop\').classList.remove(\'open\')">Close</button></div>'); };
    var input = $("#neg-input", host);
    $("#neg-mic", host).onclick = function () {
      if (!SR) { toast("Speech recognition unavailable — please type.", "warn"); return; }
      var r = makeRecognizer(function (f, i) { input.value = f + i; }, function (f) { input.value = f; });
      r.start(); toast("Listening… click Send when done.", "");
      setTimeout(function () { r.stop(); }, 12000);
    };
    $("#neg-send", host).onclick = function () {
      var text = input.value.trim();
      if (text.split(/\s+/).length < 4) { toast("Give a fuller response.", "warn"); return; }
      pushBubble(chat, ses, "me", "You", text);
      var s = scoreResponse(text, { expected: n.phrases.join(" ").toLowerCase().match(/\b[a-z]{5,}\b/g) || [], targetWords: 40 });
      ses.scores.push(evaluateNegTurn(text, n));
      input.value = "";
      // counterpart reply
      setTimeout(function () {
        var reply = negReply(n, ses);
        pushBubble(chat, ses, "them", n.counterpart, reply);
        ses.stage = Math.min(n.stages.length - 1, ses.stage + 1);
        if (ses.stage >= n.stages.length - 1 && ses.scores.length >= n.stages.length - 1) {
          setTimeout(function () { pushBubble(chat, ses, "them", n.counterpart, "I think we have the basis for an agreement. Shall we close and capture next steps?"); }, 300);
        }
        navigateSoft(host, ses);
      }, 500);
    };
    $("#neg-send", host).nextResult = null;
    // Add a finish button when near the end
    if (ses.stage >= n.stages.length - 1) {
      var fin = el("button", { class: "btn gold mt2 block" }, "Conclude & see performance report");
      fin.onclick = function () { finishNegotiation(ses); };
      host.querySelector(".card").appendChild(fin);
    }
  }
  function navigateSoft(host, ses) { // re-render stage track & finish button without losing chat scroll
    renderNegRun(host.parentElement ? host : host, ses);
  }
  function pushBubble(chat, ses, side, who, text, silent) {
    var b = el("div", { class: "bubble " + side });
    b.innerHTML = '<span class="who">' + esc(who) + '</span>' + esc(text);
    chat.appendChild(b); chat.scrollTop = chat.scrollHeight;
    if (!silent) ses.log.push({ side: side, who: who, text: text });
  }
  function evaluateNegTurn(text, n) {
    var lower = text.toLowerCase();
    var diplomacy = /\b(understand|appreciate|however|perhaps|would|could|respect|fair point|concern)\b/.test(lower) ? 82 : 60;
    var evidence = /\b(evidence|data|because|for example|shows|track|measure)\b/.test(lower) ? 84 : 58;
    var proposal = /\b(propose|suggest|offer|if you|in return|we could|pilot|first step)\b/.test(lower) ? 85 : 60;
    var terms = n.phrases.join(" ").toLowerCase();
    var vocab = (lower.match(/\b(quality|accreditation|partnership|investment|standards|autonomy|sustainability|recognition)\b/g) || []).length;
    return { diplomacy: diplomacy, evidence: evidence, proposal: proposal, clarity: clamp(60 + Math.min(30, text.length / 8), 0, 100), vocab: clamp(55 + vocab * 8, 0, 100) };
  }
  function negReply(n, ses) {
    // Cycle through objections, then move toward agreement
    var i = ses.scores.length - 1;
    if (i < n.objections.length) {
      var pre = ses.scores[i] && ses.scores[i].diplomacy > 75 ? "That’s reasonable. " : "I hear you, but ";
      return pre + '“' + n.objections[i] + '” How would you address that?';
    }

  }
  function finishNegotiation(ses) {

    var avg = function (k) { return sc.length ? Math.round(sc.reduce(function (a, s) { return a + s[k]; }, 0) / sc.length) : 60; };
    var report = { clarity: avg("clarity"), persuasiveness: avg("proposal"), diplomacy: avg("diplomacy"), evidence: avg("evidence"), vocab: avg("vocab") };
    var overall = Math.round((report.clarity + report.persuasiveness + report.diplomacy + report.evidence + report.vocab) / 5);
    S.totals.negotiations += 1; S.totals.timeMin += 6;
    recordActivity("negotiation", overall, ["negotiation", "diplomacy", "fluency"], n.title);
    negActive = null;
    modal(
      '<h2>Negotiation Report — ' + esc(n.title) + '</h2><div class="badge-score mb">Overall ' + overall + '/100</div>' +
      scoreLine("Clarity", report.clarity) + scoreLine("Persuasiveness", report.persuasiveness) + scoreLine("Diplomacy", report.diplomacy) + scoreLine("Use of evidence", report.evidence) + scoreLine("Professional vocabulary", report.vocab) +
      '<div class="divider"></div>' +
      '<div class="small"><b>What you did well.</b> ' + (report.diplomacy > 75 ? "You framed disagreement diplomatically. " : "") + (report.evidence > 75 ? "You backed points with evidence. " : "You kept the conversation moving.") + '</div>' +
      '<div class="small mt"><b>Missed opportunities.</b> ' + (report.evidence < 75 ? "Cite concrete evidence and examples. " : "") + (report.persuasiveness < 75 ? "Make more explicit proposals (‘If you…, we could…’). " : "") + (report.vocab < 75 ? "Use more sector-specific vocabulary. " : "Fine-tune tone under pressure.") + '</div>' +
      '<div class="small mt"><b>Stronger alternative.</b> “' + esc(n.phrases[0]) + '”</div>' +
      '<div class="small mt"><b>Vocabulary to review.</b> quality assurance, return on investment, mutual recognition, sustainability.</div>' +
      '<div class="small mt"><b>Recommended next.</b> ' + esc(D.NEGOTIATIONS[(D.NEGOTIATIONS.indexOf(n) + 1) % D.NEGOTIATIONS.length].title) + '</div>' +

  function field(label, inner) { return '<label class="field"><span>' + esc(label) + '</span>' + inner + '</label>'; }
  function generateSpeech(d) {
    var greet = { inspiring: "Distinguished guests, colleagues and friends —", authoritative: "Excellencies, ladies and gentlemen,", diplomatic: "Honoured guests and dear colleagues,", warm: "Dear friends and colleagues," }[d.tone];
    var parts = [];
    parts.push({ h: "Greeting", t: greet + " welcome." });

    parts.push({ h: "Context", t: "We meet at a moment of real consequence for education. The choices we make about quality will shape the trust our systems can command for a generation." });

    parts.push({ h: "Call to action", t: "So let me leave you with a request: " + d.cta + "." });
    parts.push({ h: "Closing statement", t: "The quality of a system is measured in one place only — in what a young person can do, and become, because of it. Let us hold ourselves to that standard. Thank you." });

  function analyseWriting(t) {
    var issues = [], lower = t.toLowerCase();
    var words = t.split(/\s+/).length;
    var sentences = (t.match(/[.!?]+/g) || []).length || 1;
    var avg = words / sentences;
    if (avg > 26) issues.push("Some sentences are long — consider splitting for clarity.");
    if (/\bvery |\breally |\ba lot\b/.test(lower)) issues.push("Replace informal intensifiers (‘very’, ‘really’, ‘a lot’) with precise words.");
    if (/!{1,}/.test(t)) issues.push("Avoid exclamation marks in formal writing.");
    if (/\bi think\b/.test(lower)) issues.push("‘I think’ can be softened to ‘In our assessment’ or ‘It appears that’.");
    if (!/\b(recommend|propose|suggest|would|could)\b/.test(lower)) issues.push("Add advisory language (recommend, propose, would) for a professional tone.");
    var proWords = (lower.match(/\b(quality|accreditation|stakeholder|accountability|transparency|framework|outcomes|evidence|sustainability|partnership)\b/g) || []).length;
    var clarity = clamp(100 - Math.abs(avg - 18) * 3, 40, 100);
    var tone = clamp(70 + (/\b(would|recommend|propose|kind regards|dear|thank you)\b/.test(lower) ? 20 : 0) - (/!{1,}|\bi think\b/.test(lower) ? 15 : 0), 0, 100);
    var vocab = clamp(55 + proWords * 7, 0, 100);
    return { score: Math.round((clarity + tone + vocab) / 3), clarity: Math.round(clarity), tone: tone, vocab: vocab, issues: issues };
  }

  function refreshFeed(host) {
    var btn = $("#feed-refresh", host); btn.innerHTML = '<span class="loader"></span> Fetching…'; btn.disabled = true;
    // Attempt live fetch of configured RSS via a public CORS-friendly reader; gracefully fall back.
    var active = S.settings.sources.filter(function (s) { return s.active && s.url; });
    var done = function (msg, kind) { S.feed.fetched = todayStr(); save(); btn.innerHTML = "🔄 Refresh today’s content"; btn.disabled = false; renderFeedList($("#feed-list", host)); toast(msg, kind); };
    // Shuffle cached samples as the offline-safe default (always works).
    S.feed.items = shuffle(D.FEED_SAMPLES.slice()).map(function (x) { return Object.assign({}, x); });
    S.feed.live = false;
    // Optional live attempt (best-effort; gated so failures never break the app):
    tryLiveFeed(active).then(function (items) {
      if (items && items.length) { S.feed.items = items.concat(S.feed.items).slice(0, 8); S.feed.live = true; done("Live content loaded.", "good"); }
      else done("Showing refreshed cached content (live fetch blocked or unavailable).", "");
    }).catch(function () { done("Showing refreshed cached content (offline mode).", ""); });
  }
  function tryLiveFeed(sources) {
    // Best-effort only. Uses a public reader that returns JSON; if it fails we fall back.
    if (!sources.length || !window.fetch) return Promise.resolve(null);
    var s = sources[0];
    var api = "https://api.rss2json.com/v1/api.json?rss_url=" + encodeURIComponent(s.url);
    return fetch(api).then(function (r) { return r.ok ? r.json() : null; }).then(function (j) {
      if (!j || !j.items) return null;
      return j.items.slice(0, 4).map(function (it) {
        var terms = extractTerms(it.title + " " + (it.description || ""));
        return {
          title: it.title, source: (j.feed && j.feed.title) || s.name, date: (it.pubDate || "").slice(0, 10),
          summary: stripTags(it.description || "").slice(0, 200) + "…", terms: terms,
          phrases: ["Let me set out the evidence.", "This has real implications for our sector."],
          question: "How does this affect your context?", task: "Summarise this update in 60 seconds.", link: it.link, saved: false
        };
      });
    }).catch(function () { return null; });
  }
  function stripTags(h) { var d = document.createElement("div"); d.innerHTML = h; return d.textContent || ""; }
  function extractTerms(text) {
    var known = D.VOCABULARY.map(function (v) { return v.term; });
    var found = known.filter(function (t) { return text.toLowerCase().indexOf(t) >= 0; }).slice(0, 5);
    while (found.length < 5) { var r = D.VOCABULARY[Math.abs(hash(text + found.length)) % D.VOCABULARY.length].term; if (found.indexOf(r) < 0) found.push(r); else break; }
    return found.slice(0, 5);
  }

  function buildLessonFromText(text, tag) {
    var sentences = text.split(/(?<=[.!?])\s+/).filter(function (s) { return s.split(/\s+/).length > 4; });

    // Extract longer words as candidate vocabulary

  function currentStage() {
    var o = overallScore(), st = D.STAGES[0];
    D.STAGES.forEach(function (s) { if (o >= s.threshold) st = s; });
    // stage is the highest whose threshold you EXCEED, capped; but show as current the next to work on
    var idx = 0; for (var i = 0; i < D.STAGES.length; i++) { if (o >= D.STAGES[i].threshold) idx = i; }
    return D.STAGES[Math.min(idx, 3)];
  }
  function drawRadar(cv) {
    if (!cv || !cv.getContext) return;
    var ctx = cv.getContext("2d"), n = D.INDICATORS.length, cx = 180, cy = 180, R = 130;
    ctx.clearRect(0, 0, 360, 360);
    var css = getComputedStyle(document.body);
    var line = css.getPropertyValue("--border") || "#ccc";
    var accent = "#2a5ca8";
    // grid
    for (var g = 1; g <= 4; g++) {
      ctx.beginPath();
      for (var i = 0; i <= n; i++) { var a = (i / n) * Math.PI * 2 - Math.PI / 2; var r = R * g / 4; var x = cx + r * Math.cos(a), y = cy + r * Math.sin(a); i ? ctx.lineTo(x, y) : ctx.moveTo(x, y); }
      ctx.strokeStyle = line; ctx.globalAlpha = 0.5; ctx.stroke(); ctx.globalAlpha = 1;
    }
    // data
    ctx.beginPath();
    D.INDICATORS.forEach(function (ind, i) {
      var v = S.indicators[ind.key].current / 100; var a = (i / n) * Math.PI * 2 - Math.PI / 2;
      var x = cx + R * v * Math.cos(a), y = cy + R * v * Math.sin(a); i ? ctx.lineTo(x, y) : ctx.moveTo(x, y);
    });
    ctx.closePath(); ctx.fillStyle = "rgba(42,92,168,.25)"; ctx.strokeStyle = accent; ctx.lineWidth = 2; ctx.fill(); ctx.stroke();
    // labels
    ctx.fillStyle = css.getPropertyValue("--text-soft") || "#666"; ctx.font = "9px sans-serif"; ctx.textAlign = "center";
    D.INDICATORS.forEach(function (ind, i) { var a = (i / n) * Math.PI * 2 - Math.PI / 2; var x = cx + (R + 14) * Math.cos(a), y = cy + (R + 14) * Math.sin(a); ctx.fillText(ind.name.split(" ")[0], x, y); });
  }

      "\nLevel: " + S.profile.level + " → target " + S.profile.target + "\nOverall competency: " + overallScore() + "/100\nGrowth score: " + growthScore() +

  };
})();

  /* ---- Concept comparison laboratory ---- */
  var COMPARISONS = [
    { a: "Qualification", b: "Competence", simple: "A qualification is an award; a competence is an ability.", pro: "A qualification is a formal certification of achievement; a competence is the demonstrated ability to perform to a standard. A qualification usually certifies a set of competences.", diff: [["Nature", "Formal award / certificate", "Demonstrated ability"], ["Evidence", "Certificate on the register", "Performance to a standard"]], eduEg: "A diploma in nursing is a qualification.", lmEg: "Safely administering medication is a competence.", mistake: "Treating 'qualification' and 'competence' as identical.", question: "Can someone be competent without holding the relevant qualification?", model: "Yes. Competence is the ability to perform; a qualification is formal recognition of it. Recognition of prior learning exists precisely because competent people may lack the certificate." },
    { a: "Qualification", b: "Certificate", simple: "A qualification is the achievement; a certificate is the paper proving it.", pro: "A qualification is the recognised learning achievement at a level; a certificate is the physical or digital document evidencing that a qualification has been awarded.", diff: [["Meaning", "The achievement and its level", "The document of proof"]], eduEg: "Level-six diploma (qualification).", lmEg: "The printed diploma certificate.", mistake: "Assuming a certificate alone proves a level without register data.", question: "Why is a certificate not enough for a recognition decision?", model: "Because the certificate proves an award, but recognition needs the qualification's level, learning outcomes and quality assurance — usually confirmed through the register, transcript and diploma supplement." },
    { a: "Academic recognition", b: "Professional recognition", simple: "One is for study; the other is for work.", pro: "Academic recognition concerns access to further study; professional recognition concerns the right to practise, often in a regulated profession with additional legal conditions.", diff: [["Purpose", "Further study / admission", "Right to practise"], ["Decision-maker", "University / education authority", "Professional regulator"]], eduEg: "Recognising a bachelor's degree for master's admission.", lmEg: "Recognising a medical degree to practise medicine.", mistake: "Assuming academic recognition automatically grants the right to work.", question: "Does academic recognition let someone practise a regulated profession?", model: "No. Academic recognition addresses study access only. Practising a regulated profession requires professional recognition, which may add licensing or aptitude requirements set by the regulator." },
    { a: "Equivalence", b: "Comparability", simple: "Equivalence says 'the same'; comparability says 'similar'.", pro: "Equivalence claims two qualifications are the same; comparability judges how similar they are on level and learning outcomes. Modern recognition prefers comparability because systems legitimately differ.", diff: [["Claim", "Sameness", "Degree of similarity"], ["Risk", "Overstates precision", "Realistic and defensible"]], eduEg: "Saying two degrees are 'equivalent'.", lmEg: "Stating a foreign degree is 'comparable to level six'.", mistake: "Using 'equivalence' when only comparability can be shown.", question: "Why do recognition authorities avoid the word 'equivalence'?", model: "Because systems differ in structure and duration, exact sameness is rarely provable. Comparability — a judgement of similar level and outcomes — is more honest, more defensible, and consistent with recognition conventions." },
    { a: "Recognition", b: "Validation", simple: "Recognition accepts a qualification; validation confirms learning meets a standard.", pro: "Recognition accepts an existing qualification for a purpose. Validation (in RPL) confirms that prior learning meets defined outcomes. In qualification development, 'validation' also means approving a new qualification.", diff: [["Object", "An awarded qualification", "Prior learning / a new qualification"]], eduEg: "Recognising a foreign diploma.", lmEg: "Validating a technician's workplace learning.", mistake: "Confusing the RPL and development senses of 'validation'.", question: "Is recognition the same as validation of prior learning?", model: "No. Recognition accepts an existing qualification. Validation of prior learning assesses experience against standards to award credit. They serve different applicants and follow different procedures." },
    { a: "Accreditation", b: "Recognition", simple: "Accreditation checks providers; recognition accepts qualifications.", pro: "Accreditation is quality assurance of an institution or programme. Recognition is a decision about a specific qualification held by a person. Accreditation status is one input to a recognition decision.", diff: [["Subject", "Institution / programme", "A person's qualification"]], eduEg: "Accrediting a university.", lmEg: "Recognising a graduate's degree for employment.", mistake: "Refusing recognition solely because accreditation is unfamiliar.", question: "Should recognition be refused if the awarding institution's accreditation is unclear?", model: "Not automatically. Unclear status is a reason to seek evidence — from the register, the authority, or the ENIC-NARIC network — not an automatic refusal. Refusal needs a justified substantial difference." },
    { a: "Learning outcome", b: "Assessment criterion", simple: "The outcome is what is learned; the criterion is how it's judged.", pro: "A learning outcome states what a learner will know or do; an assessment criterion specifies the evidence that shows the outcome has been achieved.", diff: [["Answers", "What is learned", "How achievement is judged"]], eduEg: "Outcome: 'Evaluate QA arrangements.'", lmEg: "Criterion: 'Identifies two improvements with evidence.'", mistake: "Writing criteria as vague as the outcome.", question: "Why must every learning outcome have an assessment criterion?", model: "Because an outcome that cannot be judged cannot be assessed fairly. Criteria make outcomes measurable, support reliability between assessors, and ensure the assessment truly measures the intended learning." },
    { a: "Occupational standard", b: "Qualification standard", simple: "One describes the job; the other describes the award.", pro: "An occupational standard defines the competences an occupation requires. A qualification standard translates those into learning outcomes, level and assessment for an award.", diff: [["Describes", "The occupation", "The qualification"]], eduEg: "Qualification standard for a level-four IT diploma.", lmEg: "Occupational standard for a network technician.", mistake: "Designing a qualification without an occupational standard.", question: "Why start qualification design from an occupational standard?", model: "Because it anchors the qualification in real labour-market needs. Without it, qualifications risk certifying learning that employers do not value, weakening relevance and graduate employability." },
    { a: "Qualification level", b: "Education level", simple: "Framework level ≠ years of schooling.", pro: "A qualification level reflects the complexity of learning outcomes on the framework; an education level often refers to a stage (primary, secondary, tertiary). The two do not map one-to-one.", diff: [["Basis", "Learning outcomes / complexity", "Educational stage / duration"]], eduEg: "A short but demanding qualification at level six.", lmEg: "A long programme that is nonetheless level four.", mistake: "Inferring level from duration or stage.", question: "Why can a shorter programme be at a higher level than a longer one?", model: "Because level reflects the complexity and autonomy of the learning, not time spent. A concentrated programme with advanced outcomes can sit above a longer programme with more basic outcomes." },
    { a: "Full recognition", b: "Partial recognition", simple: "Full accepts everything; partial accepts part.", pro: "Full recognition accepts the qualification for the intended purpose. Partial recognition accepts comparable components while identifying gaps, often with credit or conditions.", diff: [["Scope", "Whole qualification / purpose", "Components or limited purpose"]], eduEg: "Full access to a master's.", lmEg: "Credit for three of five units.", mistake: "Refusing outright where partial recognition would be proportionate.", question: "When is partial recognition the right outcome?", model: "When a real, substantial difference affects part of the qualification but comparable learning is clearly evidenced elsewhere. Partial recognition is the proportionate middle path between full recognition and refusal." },
    { a: "Automatic recognition", b: "Case-by-case recognition", simple: "One is by rule; the other is by individual assessment.", pro: "Automatic recognition applies a general rule or agreement without individual assessment. Case-by-case recognition assesses each qualification individually against the host system.", diff: [["Process", "Rule / agreement", "Individual assessment"]], eduEg: "Automatic recognition under a regional agreement.", lmEg: "Individual evaluation of an unfamiliar degree.", mistake: "Expecting automatic recognition without an underpinning agreement.", question: "What makes automatic recognition possible?", model: "Mutual trust between quality-assured systems, usually formalised in an agreement. Where that trust and agreement are absent, case-by-case assessment remains necessary." },
    { a: "Regulated profession", b: "Non-regulated profession", simple: "One is legally restricted; the other is not.", pro: "A regulated profession legally restricts practice to holders of specific qualifications; in a non-regulated profession, the employer decides on suitability.", diff: [["Access", "Legally restricted", "Employer's decision"]], eduEg: "Medicine (regulated).", lmEg: "Many IT roles (non-regulated).", mistake: "Applying regulatory conditions to a non-regulated role.", question: "Why does recognition differ for regulated professions?", model: "Because access is set by law to protect the public. For non-regulated roles, recognition informs the employer, who makes the hiring decision; for regulated ones, the regulator's conditions govern practice." },
    { a: "Formal learning", b: "Non-formal / informal learning", simple: "Formal is in the system; the others are outside it.", pro: "Formal learning is structured within the education system and certified. Non-formal learning is structured but outside it; informal learning is unstructured, from daily life and work.", diff: [["Structure", "Structured + certified", "Non-formal: structured, uncertified / Informal: unstructured"]], eduEg: "A university course (formal).", lmEg: "On-the-job training (non-formal); learning by doing (informal).", mistake: "Ignoring non-formal and informal learning in RPL.", question: "Why should recognition consider non-formal and informal learning?", model: "Because much valuable competence is gained outside formal education. Recognising it through RPL widens access, values experience, and reflects how adults actually learn." },
    { a: "Micro-credential", b: "Full qualification", simple: "Micro is small and focused; a qualification is larger.", pro: "A micro-credential certifies a specific, small volume of learning; a full qualification certifies a broad, structured programme at a level. Micro-credentials may stack towards qualifications.", diff: [["Size", "Small, focused", "Broad, structured"], ["Stackability", "Often stackable", "Usually complete"]], eduEg: "A micro-credential in data ethics.", lmEg: "A full diploma in data science.", mistake: "Treating any short course as equivalent to a qualification.", question: "Can micro-credentials form part of a full qualification?", model: "Yes, when they are quality-assured, credit-bearing and stackable. Clear metadata, defined outcomes and assessment allow accumulation towards a full qualification without lowering standards." },
    { a: "Credit transfer", b: "Qualification recognition", simple: "One moves credit; the other accepts a whole qualification.", pro: "Credit transfer recognises specific credit towards a programme; qualification recognition accepts a complete qualification for study or work.", diff: [["Object", "Units of credit", "A whole qualification"]], eduEg: "Transferring 30 credits between programmes.", lmEg: "Recognising a full foreign degree.", mistake: "Confusing partial credit with full recognition.", question: "How does credit transfer differ from recognising a qualification?", model: "Credit transfer moves specific learning into a programme the learner is pursuing. Recognition accepts an already-completed qualification for a purpose. The first builds towards an award; the second accepts one." }
  ];

    { stage: "National qualifications framework", org: "Qualifications authority", input: "Skills needs, level descriptors", output: "Level placement rules", term: ["level descriptor", "referencing"], phrase: "The qualification will be placed at level six of the framework.", risk: "Inconsistent level placement undermines trust." },
    { stage: "Sectoral qualifications framework", org: "Sector council", input: "Sector needs, NQF descriptors", output: "Sector pathways", term: ["sectoral qualifications framework", "occupational group"], phrase: "Within the sector, this sits on the technician pathway.", risk: "Sector frameworks drifting from the national one." },
    { stage: "Occupational standard", org: "Employers + sector body", input: "Occupational profile", output: "Competence requirements", term: ["occupational standard", "competence requirement"], phrase: "The occupational standard was validated with employers.", risk: "Standards written without genuine employer input." },
    { stage: "Qualification standard", org: "Awarding body / authority", input: "Occupational standard", output: "Learning outcomes, level, assessment", term: ["qualification standard", "learning outcome"], phrase: "The qualification standard translates the job into outcomes.", risk: "Outcomes not matching the occupational standard." },
    { stage: "Curriculum design", org: "Training providers", input: "Qualification standard", output: "Programme and materials", term: ["constructive alignment", "curriculum design"], phrase: "The curriculum is aligned to the intended outcomes.", risk: "Teaching drifting from the standard." },
    { stage: "Training delivery", org: "Training providers", input: "Curriculum", output: "Learning experiences", term: ["faculty development", "delivery"], phrase: "Delivery must prepare learners for authentic assessment.", risk: "Delivery quality varying across providers." },
    { stage: "Assessment", org: "Assessment body / assessors", input: "Assessment strategy", output: "Assessment decisions", term: ["assessment strategy", "moderation"], phrase: "Assessment is competence-based and moderated.", risk: "Inconsistent or unreliable assessment." },
    { stage: "Certification", org: "Awarding body", input: "Assessment decisions", output: "Qualification / units awarded", term: ["certification", "qualification award"], phrase: "Certification confirms the outcomes have been met.", risk: "Certificates that don't reflect real competence." },
    { stage: "Labour-market feedback", org: "Employers / tracer studies", input: "Graduate performance", output: "Evidence for review", term: ["graduate tracer study", "review cycle"], phrase: "Feedback feeds the next qualification review cycle.", risk: "No feedback loop, so qualifications go stale." }
