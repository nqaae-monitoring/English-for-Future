  /* ---- Difficult questions (Section 20) ---- */
  var QUESTIONS = [
    { q: "What is the practical value of a national qualifications framework?", s: "Point–Reason–Example–Point", vocab: ["national qualifications framework", "comparability", "progression pathway", "transparency"], model: "Its value is practical, not symbolic. A framework gives every qualification a clear level and a common language, so learners can see progression routes, employers can read qualifications with confidence, and foreign partners can compare ours fairly. For example, placing a diploma at level six instantly signals its demand. In short, a framework turns a patchwork of certificates into a transparent, navigable system." },
    { q: "How is a qualification assigned to a level?", s: "Situation–Action–Result", vocab: ["level descriptor", "learning outcome", "knowledge, skills and autonomy", "referencing"], model: "It is assigned by matching, not by guesswork. We take the qualification's learning outcomes and compare them, dimension by dimension, against the level descriptors — knowledge, skills, and autonomy. The best-fit level, judged by a panel and evidenced against the descriptors, becomes the assigned level. The result is a placement that is transparent and defensible rather than arbitrary." },
    { q: "Who is responsible for maintaining the qualifications register?", s: "Position–Evidence–Recommendation", vocab: ["qualifications register", "qualifications authority", "metadata", "governance"], model: "The qualifications authority is responsible, under clear governance rules. It approves entries, maintains accurate metadata, and keeps the register public and current. I would add that a register is only as trustworthy as its upkeep, so I recommend regular data audits and a defined review cycle for every listed qualification." },
    { q: "How do you ensure qualifications remain relevant to employers?", s: "Problem–Evidence–Solution", vocab: ["occupational standard", "labour-market relevance", "review cycle", "stakeholder involvement"], model: "Relevance is engineered, not assumed. The problem is that labour markets change faster than qualifications. The evidence is our tracer studies and employer feedback. The solution is to root qualifications in employer-validated occupational standards and to build in a regular review cycle, so qualifications are updated before they drift out of date." },
    { q: "How do you prevent qualification inflation?", s: "Position–Evidence–Recommendation", vocab: ["level descriptor", "moderation", "quality assurance mechanism", "benchmarking"], model: "By anchoring levels to outcomes, not to titles or pressure. If every qualification is placed strictly against level descriptors and assessment is moderated to a consistent standard, a level six means the same thing everywhere. I recommend external verification and international benchmarking as checks, because inflation is best prevented by transparent, comparable standards." },
    { q: "What is the difference between recognition and equivalence?", s: "Point–Reason–Example–Point", vocab: ["recognition of qualifications", "equivalence", "comparability", "recognition decision"], model: "Recognition is a decision; equivalence is a claim. Recognition accepts a qualification for a purpose, based on comparability. Equivalence asserts two qualifications are identical — which is rarely provable across different systems. For example, we recognise a foreign degree as comparable to level six for master's access, without claiming it is 'equivalent'. So recognition is the practical act; equivalence is a stronger, usually avoidable claim." },
    { q: "Why can recognition not be based only on programme duration?", s: "Problem–Evidence–Solution", vocab: ["learning outcome", "substantial difference", "comparability", "proportionality"], model: "Because duration measures time, not learning. A shorter programme with advanced outcomes may exceed a longer one. The evidence is that level reflects the complexity of learning outcomes, not hours. So we compare outcomes and level; duration is only one factor. Refusing over a duration gap alone, without a real difference in learning, would be disproportionate and unfair." },
    { q: "What constitutes a substantial difference?", s: "Position–Evidence–Recommendation", vocab: ["substantial difference", "learning outcome", "professional recognition", "proportionality"], model: "A substantial difference is one significant enough to affect the qualification's fitness for the specific purpose sought — in level, key learning outcomes, or, for regulated professions, essential competences. It is not any difference, but a material one. I recommend the authority bear the burden of proving it, and always consider partial or conditional recognition before refusal." },
    { q: "How do you recognise qualifications from unfamiliar systems?", s: "Situation–Action–Result", vocab: ["credential evaluation", "referencing", "ENIC-NARIC", "comparability statement"], model: "Unfamiliar does not mean unrecognisable. We gather information on the system — its framework, quality assurance and the institution's status — using the ENIC-NARIC network and official sources. We then compare learning outcomes and level, not surface features. The result is a reasoned comparability statement, so an unfamiliar system is handled with method rather than suspicion." },
    { q: "How do you verify the authenticity of foreign qualifications?", s: "Problem–Evidence–Solution", vocab: ["verification of authenticity", "documentary evidence", "issuing authority", "fraudulent credential"], model: "Fraud is a real risk, so verification is systematic. We examine documentary evidence for consistency, cross-check against registers, and, where needed, contact the issuing authority directly. Increasingly, digital and verifiable credentials allow instant checks. The aim is confidence in authenticity before any recognition decision, protecting both the system and honest applicants." },
    { q: "Can work experience compensate for academic differences?", s: "Position–Evidence–Recommendation", vocab: ["recognition of prior learning", "learning outcome", "substantial difference", "proportionality"], model: "Often, yes. If relevant work experience demonstrably covers the missing learning outcomes, it can compensate for an academic gap, especially through recognition of prior learning. The test is whether the outcomes are met, not how. I recommend assessing the evidence proportionately rather than refusing over a formal difference the applicant has clearly bridged in practice." },
    { q: "How do you recognise qualifications held by refugees?", s: "Problem–Evidence–Solution", vocab: ["documentary evidence", "recognition of prior learning", "proportionality", "background paper"], model: "The problem is missing documents through no fault of the holder. The evidence-based solution is a flexible procedure — such as a background assessment — that reconstructs the qualification from available evidence and structured interviews, rather than demanding paperwork that cannot be obtained. Proportionality and fairness require that we do not let lost documents erase real learning." },
    { q: "What safeguards are required for recognition of prior learning?", s: "Position–Evidence–Recommendation", vocab: ["recognition of prior learning", "authenticity", "assessor", "quality assurance mechanism"], model: "RPL must be as rigorous as any assessment. Safeguards include trained, independent assessors; clear mapping of evidence to outcomes; checks on authenticity and sufficiency; and the same quality assurance as formal assessment. I recommend transparent criteria and an appeals route, so RPL is credible to employers and universities alike, not a shortcut." },
    { q: "How should micro-credentials be regulated?", s: "Point–Reason–Example–Point", vocab: ["micro-credential", "quality assurance mechanism", "level", "metadata"], model: "Proportionately, but not casually. Micro-credentials need defined outcomes, a level, transparent metadata and quality-assured assessment — enough to be trusted and, where intended, credit-bearing. For example, a stackable micro-credential should carry the same assurance as the units it may build towards. The point is to enable innovation while protecting the currency of credentials." },
    { q: "Who should award qualifications?", s: "Position–Evidence–Recommendation", vocab: ["awarding body", "competent authority", "quality assurance mechanism", "governance"], model: "Only bodies that are authorised and quality-assured. Awarding should rest with accountable awarding bodies operating under the authority's rules, with clear separation between those who deliver and those who assure. I recommend that the right to award be earned through demonstrated capacity, because the value of a qualification depends on trust in who stands behind it." },
    { q: "How is assessor independence guaranteed?", s: "Problem–Evidence–Solution", vocab: ["assessor", "conflict of interest", "internal verification", "moderation"], model: "Independence is built in, not assumed. Assessors declare conflicts of interest and are recused where needed; decisions are checked through internal and external verification; and moderation aligns judgements. The evidence trail is auditable. So independence is protected structurally — through separation, verification and transparency — rather than resting on individual goodwill." },
    { q: "How do appeals work?", s: "Situation–Action–Result", vocab: ["appeal procedure", "recognition decision", "fairness", "proportionality"], model: "Appeals turn a decision into a fair process. An applicant who disagrees may, within a stated period, request review by a body independent of the original decision. The evidence is re-examined against the same criteria. The result is either confirmation, with clearer reasons, or a revised decision. Appeals protect fairness and improve the consistency of the system." },
    { q: "How does the system support lifelong learning?", s: "Point–Reason–Example–Point", vocab: ["lifelong learning", "credit accumulation", "recognition of prior learning", "micro-credential"], model: "It supports lifelong learning by making learning cumulative and portable. Because credit can be accumulated and prior learning recognised, adults can qualify in stages around work and life. For example, stackable micro-credentials let a professional build towards a full qualification over time. The point is a system that welcomes learners back, at any age." },
    { q: "How does the qualifications system contribute to labour mobility?", s: "Position–Evidence–Recommendation", vocab: ["portability of qualifications", "comparability", "recognition of qualifications", "diploma supplement"], model: "By making qualifications readable and portable across borders. Referencing our framework internationally, issuing diploma supplements, and building recognition arrangements let our qualifications be understood and trusted abroad. I recommend investing in transparency tools and recognition networks, because mobility depends less on the qualification itself than on others' confidence in reading it." },
    { q: "Why should international investors trust your qualifications system?", s: "Position–Evidence–Recommendation", vocab: ["quality assurance mechanism", "transparency", "benchmarking", "governance"], model: "Because it is transparent and quality-assured by design. Standards are employer-validated, decisions are governed and auditable, and our framework is benchmarked internationally. I would not ask investors to take this on trust; I would invite scrutiny — the register, the standards and the outcomes are open to examination, and confidence built on evidence is the only confidence worth having." }
  ];

  /* ---- Recognition case simulator (Section 13) ---- */
  var CASES = [
    { id: 1, title: "Three-year foreign bachelor vs four-year national programme", profile: "Applicant with a 3-year bachelor's (180 credits) seeking master's admission where the national bachelor is 4 years (240 credits).", ctx: "Bologna-style 3-year degree; national system uses 4-year degrees.", purpose: "Academic recognition for master's admission.", issues: ["Duration and credit difference", "Whether outcomes reach the required level"], vocab: ["comparability", "substantial difference", "learning outcome", "access qualification"], model: "Duration alone is not decisive. A 3-year, 180-credit degree in a quality-assured Bologna system typically gives access to master's study. Compare learning outcomes and level, not years. If the degree gives access to master's study at home, that is strong evidence. Likely outcome: full recognition for admission, possibly with programme-specific prerequisites.", outcome: "Full recognition for admission (subject to any subject prerequisites)." },
    { id: 2, title: "Institution with unclear accreditation status", profile: "Applicant from an institution whose accreditation cannot be immediately confirmed.", ctx: "Unfamiliar system; register access limited.", purpose: "Academic recognition.", issues: ["Institutional status", "Programme quality assurance"], vocab: ["accreditation", "verification of authenticity", "ENIC-NARIC", "competent authority"], model: "Unclear status is a reason to investigate, not to refuse. Use the ENIC-NARIC network and the country's register to confirm the institution's and programme's status. If the institution is recognised at home and quality-assured, proceed to compare outcomes. Refusal requires a justified substantial difference, not mere unfamiliarity.", outcome: "Request additional evidence; decide once status is confirmed." },
    { id: 3, title: "Distance-learning qualification", profile: "Applicant holding a fully online degree.", ctx: "Mode of study differs from traditional face-to-face.", purpose: "Professional recognition for employment.", issues: ["Mode of delivery", "Assessment integrity"], vocab: ["learning outcome", "assessment", "quality assurance mechanism", "substantial difference"], model: "Mode of delivery is not, in itself, a substantial difference. What matters is whether the learning outcomes were achieved and assessment integrity assured. If the provider is quality-assured and assessment is secure, recognise on outcomes. Only genuine gaps in assessed competence justify limiting recognition.", outcome: "Recognition if quality assurance and assessment integrity are confirmed." },
    { id: 4, title: "Joint degree from two universities", profile: "Applicant with a joint degree awarded by two institutions in two countries.", ctx: "Single programme, two awarding bodies.", purpose: "Academic recognition.", issues: ["Which system to reference", "Documenting the joint award"], vocab: ["awarding body", "diploma supplement", "referencing", "comparability"], model: "Treat it as one integrated qualification. Use the diploma supplement to see the combined outcomes and each institution's role. Reference it to the level its outcomes support. Joint provision is a strength, not a complication, provided both awarding bodies are quality-assured.", outcome: "Recognition based on the combined learning outcomes and level." },
    { id: 5, title: "Transnational education qualification", profile: "Degree delivered in Country A but awarded by an institution in Country B.", ctx: "Provider and awarding body in different countries.", purpose: "Academic recognition.", issues: ["Which quality assurance applies", "Awarding body's status"], vocab: ["transnational education", "awarding body", "quality assurance mechanism", "comparability"], model: "Focus on the awarding body and its quality assurance, then confirm the delivery met that standard. If the awarding institution is quality-assured and stands behind the outcomes, the location of delivery is secondary. Verify the arrangement is recognised in the awarding country.", outcome: "Recognition if the awarding body's QA covers the delivery." },
    { id: 6, title: "Refugee with incomplete documentation", profile: "Qualified professional who fled without full documents.", ctx: "Documents cannot be obtained from the home country.", purpose: "Academic and professional recognition.", issues: ["Missing documentary evidence", "Fair reconstruction of the qualification"], vocab: ["documentary evidence", "recognition of prior learning", "proportionality", "background assessment"], model: "Do not let lost documents erase real learning. Use a flexible, proportionate procedure — a background assessment combining available evidence with structured interviews — to reconstruct the qualification. Fairness and international good practice require accommodating applicants who cannot obtain paperwork through no fault of their own.", outcome: "Background assessment; recognition on reconstructed evidence." },
    { id: 7, title: "Qualification for a regulated profession", profile: "Foreign medical degree; applicant wishes to practise.", ctx: "Profession is legally regulated.", purpose: "Professional recognition.", issues: ["Essential competences for safe practice", "Regulator's conditions"], vocab: ["regulated profession", "professional recognition", "compensation measure", "substantial difference"], model: "Here the bar is public safety, set by the regulator. Compare essential competences; a genuine gap in a safety-critical area may justify a compensation measure such as an aptitude test or adaptation period, not outright refusal. Academic comparability is necessary but not sufficient — the regulator's conditions govern practice.", outcome: "Recognition subject to any compensation measure set by the regulator." },
    { id: 8, title: "Professional qualification without a traditional degree", profile: "Experienced technician with industry certifications but no academic degree.", ctx: "Competence gained through work and non-formal learning.", purpose: "Professional recognition / access.", issues: ["No formal degree", "Evidence of competence"], vocab: ["recognition of prior learning", "occupational standard", "portfolio assessment", "competence-based assessment"], model: "The absence of a degree is not the absence of competence. Assess against the relevant occupational standard through RPL — portfolio and, if needed, practical demonstration. If the outcomes are met, recognise the competence for the purpose sought. This is exactly what RPL exists to do.", outcome: "Recognition via RPL against the occupational standard." },
    { id: 9, title: "Micro-credential presented for credit", profile: "Applicant offers a micro-credential towards a qualification.", ctx: "Credit recognition request.", purpose: "Credit transfer.", issues: ["Whether it is credit-bearing", "Quality assurance and level"], vocab: ["micro-credential", "credit-bearing micro-credential", "metadata", "level"], model: "Check the metadata: outcomes, level, workload, assessment and issuer. If it is a quality-assured, credit-bearing micro-credential whose outcomes match part of the target qualification, award the corresponding credit. If non-credit or unassured, it may inform, but not substitute for, assessed learning.", outcome: "Credit award if credit-bearing and outcomes match; otherwise partial/none." },
    { id: 10, title: "Qualification with significant work-based learning", profile: "Applicant with a qualification largely delivered through workplace learning.", ctx: "High proportion of work-based assessment.", purpose: "Academic recognition.", issues: ["Comparability of work-based outcomes", "Assessment rigour"], vocab: ["learning outcome", "competence-based assessment", "authenticity", "comparability"], model: "Work-based learning is a legitimate route, not a lesser one. Compare the assessed learning outcomes and confirm assessment was rigorous and authentic. If outcomes at the claimed level are met, recognise. Do not discount competence simply because it was gained and assessed in the workplace.", outcome: "Recognition where work-based outcomes are comparable and assured." },
    { id: 11, title: "Diploma issued under a previous education system", profile: "Older diploma from a since-reformed national system.", ctx: "Legacy qualification; framework has changed.", purpose: "Academic recognition.", issues: ["Mapping legacy to current framework", "Historical context"], vocab: ["referencing", "level descriptor", "comparability", "background paper"], model: "Judge the qualification in its own context, then map it forward. Use historical information and the previous framework to establish its original level, then reference that to the current framework by outcomes. A qualification does not lose value merely because the system that issued it has since changed.", outcome: "Recognition by mapping the legacy qualification to the current level." },
    { id: 12, title: "Different credit system", profile: "Qualification measured in an unfamiliar credit system.", ctx: "Credits not directly comparable.", purpose: "Academic recognition / credit.", issues: ["Credit conversion", "Actual workload and outcomes"], vocab: ["credit transfer", "learning outcome", "comparability", "workload"], model: "Do not convert credits mechanically. Establish the real workload and outcomes behind the credits, then compare. Credit systems are tools, not truths; the substance is the learning achieved. Reference that substance to our level and credit expectations.", outcome: "Recognition based on actual workload and outcomes, not raw credit numbers." },
    { id: 13, title: "Partial qualification", profile: "Applicant completed part of a qualification.", ctx: "Programme not finished.", purpose: "Credit recognition.", issues: ["What was actually achieved", "Unit-level evidence"], vocab: ["partial qualification", "unit certification", "credit award", "transcript of records"], model: "Recognise what was genuinely completed. Use the transcript to identify units achieved and award corresponding credit towards a comparable programme. A partial qualification is not nothing; the completed, assessed units retain value and can support progression.", outcome: "Credit award for completed, evidenced units." },
    { id: 14, title: "Qualification via recognition of prior learning", profile: "Applicant whose qualification was itself awarded partly through RPL.", ctx: "RPL-based award abroad.", purpose: "Academic/professional recognition.", issues: ["Rigour of the RPL process", "Comparability of outcomes"], vocab: ["recognition of prior learning", "quality assurance mechanism", "learning outcome", "authenticity"], model: "An RPL-based qualification is a real qualification if the RPL was quality-assured. Confirm the process met sound standards, then compare outcomes as usual. Do not discount it for the route taken; recognition follows outcomes and assurance, not the mode of learning.", outcome: "Recognition where the RPL process was quality-assured." },
    { id: 15, title: "Online programme from a foreign provider", profile: "Fully online degree from a provider based abroad.", ctx: "Cross-border online delivery.", purpose: "Academic recognition.", issues: ["Provider status", "Assessment security"], vocab: ["quality assurance mechanism", "awarding body", "authenticity", "comparability"], model: "Confirm the provider is recognised and quality-assured in its own country and that assessment was secure. Online mode is not a substantial difference in itself. If provider status and assessment integrity check out, recognise on outcomes.", outcome: "Recognition subject to provider status and assessment integrity." },
    { id: 16, title: "Qualification from a branch campus", profile: "Degree from a branch campus of a foreign university.", ctx: "Awarding body abroad; campus local or third-country.", purpose: "Academic recognition.", issues: ["Which QA applies", "Parity with home campus"], vocab: ["awarding body", "quality assurance mechanism", "transnational education", "comparability"], model: "The key question is whether the branch award carries the same quality assurance and standard as the home institution. If the awarding body assures parity and the qualification is recognised at home, recognise it. Verify the branch arrangement is officially sanctioned.", outcome: "Recognition where parity with the home award is assured." },
    { id: 17, title: "Title does not indicate the level", profile: "Qualification whose name gives no clue to its level.", ctx: "Non-standard title.", purpose: "Academic recognition.", issues: ["Establishing the level", "Avoiding assumptions from the title"], vocab: ["qualification title", "level descriptor", "learning outcome", "referencing"], model: "Ignore the label; read the learning. Use the transcript, diploma supplement and framework information to determine the level from outcomes, not the title. Titles vary across systems; the level lives in the outcomes and the framework placement.", outcome: "Recognition at the level established from outcomes." },
    { id: 18, title: "Doctorate without a conventional dissertation", profile: "Doctoral qualification awarded via portfolio or practice, not a classic thesis.", ctx: "Professional or practice-based doctorate.", purpose: "Academic/professional recognition.", issues: ["Comparability of doctoral outcomes", "Different research format"], vocab: ["learning outcome", "comparability", "professional recognition", "substantial difference"], model: "A professional doctorate is still doctoral if its outcomes match level eight. Compare the demonstrated original contribution and advanced competence, not the format. A different research vehicle is not a substantial difference where the doctoral outcomes are clearly met.", outcome: "Recognition at doctoral level where outcomes are comparable." },
    { id: 19, title: "No available transcript", profile: "Applicant can provide a diploma but no transcript.", ctx: "Transcript unobtainable.", purpose: "Academic recognition.", issues: ["Establishing content and outcomes", "Alternative evidence"], vocab: ["documentary evidence", "diploma supplement", "verification of authenticity", "proportionality"], model: "Seek alternative evidence proportionately: the diploma supplement, programme information from the institution or register, and verification with the issuing authority. Do not refuse solely for a missing transcript if the qualification can be established by other reliable means.", outcome: "Recognition if content/level can be established by other evidence." },
    { id: 20, title: "Qualification linked to a regulated occupation abroad", profile: "Qualification that confers professional rights in the home country.", ctx: "Rights are regulated at home; may differ locally.", purpose: "Professional recognition.", issues: ["Different regulatory scope", "Essential competences"], vocab: ["regulated profession", "professional recognition", "compensation measure", "competent recognition authority"], model: "Home-country professional rights do not transfer automatically; the local regulator decides. Compare essential competences against local requirements. Where a real, safety-relevant gap exists, apply a proportionate compensation measure. Where competences align, recognise for practice, subject to the regulator's conditions.", outcome: "Professional recognition subject to the regulator's conditions/compensation measures." }
  ];

      stages: ["Need", "Data limits", "Responsibilities", "Response times", "Agreement"],

    { id: "q-referencing", title: "Referencing National Frameworks", counterpart: "Regional framework expert",

      objectives: ["Achieve credible referencing", "Show quality assurance", "Manage expectations about recognition"],

      var r = checkOutcome(t);
      host.querySelector("#lo-out").innerHTML = '<div class="card" style="background:var(--surface-2)"><div class="badge-score">Quality ' + r.score + '/100</div>' +
        r.checks.map(function (c) { return '<div class="small" style="padding:3px 0">' + (c.ok ? '<span class="good-word">✓</span>' : '<span class="err-word">✗</span>') + ' ' + esc(c.label) + '</div>'; }).join("") +
        (r.tips.length ? '<div class="small mt"><b>Suggestions:</b> ' + r.tips.map(esc).join(" ") + '</div>' : '<div class="good-word small mt">Well-formed outcome.</div>') + '</div>';
      qRecord(r.score, ["q_outcomes"], "learning outcome");
    };
  }
  function checkOutcome(t) {
    var lower = t.toLowerCase(), checks = [], tips = [];
    var strong = /\b(evaluate|assess|analyse|analyze|design|develop|formulate|apply|demonstrate|compare|justify|recommend|produce|construct|interpret|examine|appraise|critique|implement)\b/.test(lower);
    var vague = /\b(understand|know|be aware|learn about|appreciate|be familiar)\b/.test(lower);
    checks.push({ label: "Uses a measurable action verb", ok: strong && !vague });
    checks.push({ label: "Observable / assessable performance", ok: strong && t.split(/\s+/).length > 6 });
    checks.push({ label: "Specifies the object of learning", ok: t.split(/\s+/).length > 8 });
    checks.push({ label: "Condition or standard included", ok: /\b(against|in accordance|to the standard|using|based on|in line with)\b/.test(lower) });
    checks.push({ label: "Not vague ('understand'/'know')", ok: !vague });
    if (vague) tips.push("Replace ‘understand/know’ with an observable verb (evaluate, analyse, apply).");
    if (!/\b(against|using|in accordance)\b/.test(lower)) tips.push("Add a condition or standard (e.g. ‘against national standards’).");
    if (t.split(/\s+/).length < 8) tips.push("Be more specific about what and how.");
    var okc = checks.filter(function (c) { return c.ok; }).length;
    return { score: Math.round(okc / checks.length * 100), checks: checks, tips: tips };
  }

    { who: "Appeals commission", task: "Defend a recognition decision on the basis of evidence and proportionality.", vocab: ["appeal procedure", "substantial difference", "proportionality"] },
    { who: "Applicant (refusal)", task: "Communicate a refusal diplomatically and explain the appeal route.", vocab: ["refusal of recognition", "appeal procedure", "substantial difference"] },
    { who: "Ministry representative", task: "Explain the recognition methodology in plain, confident terms.", vocab: ["comparability", "learning outcome", "competent authority"] }
  ];
  function vInterview(host) {
    host.innerHTML = head("Recognition Interview Simulator", "Communicate difficult recognition messages to different audiences — clearly, diplomatically and correctly.") + '<div class="grid auto" id="il"></div>';
    var l = host.querySelector("#il");
    INTERVIEWS.forEach(function (it) {
      var d = el("div", { class: "card" });
      d.innerHTML = '<div class="tag">' + esc(it.who) + '</div><p class="mt" style="font-weight:600">' + esc(it.task) + '</p><div class="small muted">Use: ' + it.vocab.map(function (v) { return '<span class="tag">' + esc(v) + '</span>'; }).join(" ") + '</div><button class="btn primary mt block">Practise</button>';
      d.querySelector("button").onclick = function () { practiceTask(it.task, it.vocab, ["q_diplomacy", "q_professional", "q_qa"]); };
      l.appendChild(d);
    });
  }

  /* ---------- Difficult Questions ---------- */
  var qdIdx = 0;
  function vDiff(host) {
    host.innerHTML = head("Difficult Questions — Qualifications & Recognition", Q.QUESTIONS.length + " challenging questions with structures, key terms and model answers.") +
      '<div class="grid cols-3"><div class="card"><h3>Questions</h3><div id="ql"></div></div><div class="card" style="grid-column:span 2"><div id="qd"></div></div></div>';
    var l = host.querySelector("#ql");
    Q.QUESTIONS.forEach(function (qq, i) { var b = el("button", { class: "btn block mb " + (i === qdIdx ? "primary" : ""), style: "text-align:left;height:auto;white-space:normal;padding:10px" }, esc(qq.q)); b.onclick = function () { qdIdx = i; window.ELH.nav("qdiff"); }; l.appendChild(b); });
    qdDetail(host.querySelector("#qd"), Q.QUESTIONS[qdIdx]);
  }
  function qdDetail(host, qq) {
    host.innerHTML = '<div class="pos" style="color:var(--accent)">Structure: ' + esc(qq.s) + '</div><h2>' + esc(qq.q) + '</h2>' +
      '<div class="btn-row mt"><button class="btn" id="qt">⏱ 20s</button><button class="btn" id="qm">🔊 Model</button></div>' +
      '<div class="small mt"><b>Key vocabulary:</b> ' + qq.vocab.map(function (v) { return '<span class="tag">' + esc(v) + '</span>'; }).join(" ") + '</div>' +
      '<label class="field mt"><span>Your answer</span><textarea id="qa"></textarea></label><div class="btn-row"><button class="btn" id="qmic">🎙️</button><button class="btn primary" id="qe">Evaluate</button></div><div id="qfb" class="mt"></div>' +
      '<details class="mt"><summary class="small muted" style="cursor:pointer">Reveal model answer</summary><div class="small mt" style="background:var(--surface-2);padding:10px;border-radius:8px">' + esc(qq.model) + '</div></details>';
    var timer;
    host.querySelector("#qt").onclick = function () { var s = 20, b = host.querySelector("#qt"); clearInterval(timer); timer = setInterval(function () { s--; b.textContent = "⏱ " + s + "s"; if (s <= 0) { clearInterval(timer); b.textContent = "⏱ Go!"; speak("Your time starts now."); } }, 1000); };
    host.querySelector("#qm").onclick = function () { speak(qq.model, 0.99); };
    host.querySelector("#qmic").onclick = function () { var r = window.ELH.makeRecognizer(function (f, i) { host.querySelector("#qa").value = f + i; }, function (f) { host.querySelector("#qa").value = f; }); if (!r) { toast("Speech recognition unavailable — type instead.", "warn"); return; } r.start(); toast("Listening…", ""); setTimeout(function () { r.stop(); }, 30000); };
    host.querySelector("#qe").onclick = function () {
      var t = host.querySelector("#qa").value.trim(); if (t.split(/\s+/).length < 10) { toast("Give a fuller answer.", "warn"); return; }
      var s = score(t, { expected: qq.vocab, targetWords: 110 });
      host.querySelector("#qfb").innerHTML = fbCard(s, "Follow " + qq.s + " and weave in the key terms.");
      qRecord(s.overall, ["q_qa", "q_diplomacy"], qq.q.slice(0, 40));
    };
  }

  /* ---------- Phrase Bank ---------- */
  var pGroup = "All";
  function vPhrase(host) {
    host.innerHTML = head("Qualifications Phrase Bank", allPhrases().length + " professional phrases for explaining systems, comparing, deciding, disagreeing diplomatically and negotiating.") +
      '<div class="chip-row mb" id="pf"><button class="chip ' + (pGroup === "All" ? "on" : "") + '" data-g="All">All</button>' + Q.PHRASE_GROUPS.map(function (g) { return '<button class="chip ' + (pGroup === g.group ? "on" : "") + '" data-g="' + esc(g.group) + '">' + esc(g.group) + '</button>'; }).join("") + '</div><div class="grid auto" id="pl"></div>';
    host.querySelectorAll("#pf .chip").forEach(function (c) { c.onclick = function () { pGroup = c.dataset.g; window.ELH.nav("qphrase"); }; });
    var list = allPhrases().filter(function (p) { return pGroup === "All" || p.group === pGroup; });
    var l = host.querySelector("#pl");
    list.forEach(function (p) {
      var saved = qs().saved.indexOf(p.p) >= 0;
      var d = el("div", { class: "card" });
      d.innerHTML = '<div class="flex between"><span class="tag ' + (p.tag === "diplomatic" ? "diplomatic" : "formal") + '">' + esc(p.group) + '</span><button class="icon-btn sv" style="width:30px;height:30px">' + (saved ? "★" : "☆") + '</button></div><p style="font-weight:600;margin-top:8px">“' + esc(p.p) + '”' + uz(p.uz) + '</p><div class="btn-row"><button class="btn sm say">🔊</button><button class="btn sm pr">🎙️ Practise</button></div>';
      d.querySelector(".say").onclick = function () { speak(p.p); };
      d.querySelector(".pr").onclick = function () { practiceTask("Say this phrase naturally and in context: “" + p.p + "”", p.p.toLowerCase().split(" ").filter(function (w) { return w.length > 5; }), ["q_diplomacy"]); };
      d.querySelector(".sv").onclick = function () { var i = qs().saved.indexOf(p.p); if (i >= 0) { qs().saved.splice(i, 1); d.querySelector(".sv").textContent = "☆"; } else { qs().saved.push(p.p); d.querySelector(".sv").textContent = "★"; toast("Saved.", "good"); } window.ELH.save(); };
      l.appendChild(d);
    });
  }

  /* ---------- Presentation Studio ---------- */
  var presIdx = 0;
  function vPresent(host) {
    host.innerHTML = head("Qualifications Presentation Studio", "Ten policy presentations with structure, slide titles, speaker notes and expected questions.") +
      '<div class="grid cols-3"><div class="card"><h3>Presentations</h3><div id="pl"></div></div><div class="card" style="grid-column:span 2"><div id="pd"></div></div></div>';
    var l = host.querySelector("#pl");
    Q.PRESENTATIONS.forEach(function (p, i) { var b = el("button", { class: "btn block mb " + (i === presIdx ? "primary" : ""), style: "text-align:left;height:auto;white-space:normal;padding:9px" }, esc(p.title)); b.onclick = function () { presIdx = i; window.ELH.nav("qpresent"); }; l.appendChild(b); });
    presDetail(host.querySelector("#pd"), Q.PRESENTATIONS[presIdx]);
  }
  function presDetail(host, p) {
    var deck = buildDeck(p);
    host.innerHTML = '<div class="flex between"><h2>' + esc(p.title) + '</h2><div class="btn-row"><span class="chip" id="pv-len" data-len="5">5-min</span><button class="btn sm" id="pv-print">🖨 Export</button></div></div>' +
      '<div id="pv-body"></div>';
    function render(len) {
      var slides = len === 5 ? deck.filter(function (_, i) { return [0, 1, 2, 4, 9].indexOf(i) >= 0; }) : deck;
      host.querySelector("#pv-body").innerHTML = slides.map(function (s) { return '<div class="mb"><div class="pos" style="color:var(--accent)">' + esc(s.title) + '</div><div class="small">' + esc(s.notes) + '</div></div>'; }).join("") +
        '<div class="small mt"><b>Expected questions:</b> ' + expectedQs(p).map(esc).join(" · ") + '</div>' +
        '<div class="btn-row mt"><button class="btn sm" id="pv-say">🔊 Read notes</button><button class="btn sm" id="pv-prac">🎙️ Rehearse opening</button></div>';
      host.querySelector("#pv-say").onclick = function () { speak(slides.map(function (s) { return s.notes; }).join(" ")); };
      host.querySelector("#pv-prac").onclick = function () { practiceTask("Deliver the opening two minutes of: " + p.title, ["qualifications", "framework", "recognition", "quality assurance", "learning outcome"], ["q_presentation", "q_case"]); };
    }
    var len = 5;
    host.querySelector("#pv-len").onclick = function () { len = len === 5 ? 15 : 5; this.textContent = len + "-min"; render(len); };
    host.querySelector("#pv-print").onclick = function () { window.ELH.exportPrint(p.title, deck.map(function (s) { return s.title.toUpperCase() + "\n" + s.notes; }).join("\n\n")); };
    render(5);
    qs(); // ensure state
  }
  function buildDeck(p) {
    var notes = {
      "Title & purpose": "Good morning. Today I will present " + p.title.toLowerCase() + ", and why it matters for learners, employers and our international partners.",
      "Context & rationale": "We act because qualifications must be trusted, comparable and relevant. That trust is earned through transparent, quality-assured arrangements.",
      "Structure / how it works": "Let me set out how it works, step by step, in plain terms.",
      "Key features": "The key features are clear levels, employer-validated standards, rigorous assessment and transparent recognition.",
      "Evidence & examples": "Consider the evidence: employer validation, tracer data and international benchmarking all point the same way.",
      "Benefits for stakeholders": "For learners, clearer pathways; for employers, trusted qualifications; for partners, comparability.",
      "Challenges & safeguards": "The honest challenges are capacity and sustainability; our safeguards are quality assurance and a regular review cycle.",
      "International alignment": "Our framework is referenced internationally and supported by transparency tools such as the diploma supplement.",
      "Recommendations": "I recommend three things: measure what matters, publish it, and act on it.",
      "Questions & close": "The measure of our system is what a learner can do, and become, because of it. Thank you — I welcome your questions."
    };
    return p.slides.map(function (s) { return { title: s, notes: notes[s] || "" }; });
  }
  function expectedQs(p) { return ["What is the practical value of this?", "How is quality assured?", "How does it compare internationally?", "What are the risks?"]; }

  /* ---------- Daily & Weekly ---------- */
  function vDaily(host) {
    var d = dailyLesson();
    host.innerHTML = head("Daily & Weekly Learning", "A daily qualifications lesson and a themed seven-day cycle.") +
      '<div class="card mb"><h3>Today’s qualifications lesson</h3>' +
      '<div class="grid cols-2"><div>' +
      '<div class="small"><b>Term of the day:</b> ' + esc(d.term.term) + ' <span class="muted">— ' + esc(d.term.def) + '</span></div>' +
      '<div class="small mt"><b>Phrase of the day:</b> “' + esc(d.phrase) + '”</div>' +
      '<div class="small mt"><b>Concept comparison:</b> ' + esc(d.compare.a) + ' vs ' + esc(d.compare.b) + '</div>' +
      '<div class="small mt"><b>Recognition case:</b> ' + esc(d.case.title) + '</div></div>' +
      '<div><div class="small"><b>Speaking task:</b> ' + esc(d.speaking) + '</div>' +
      '<div class="small mt"><b>Writing task:</b> Draft a short request for additional qualification documents.</div>' +
      '<div class="small mt"><b>Difficult question:</b> ' + esc(d.question.q) + '</div>' +
      '<div class="small mt"><b>Reflection:</b> What did you find hardest to express in English today?</div></div></div>' +
      '<div class="btn-row mt"><button class="btn primary sp">🎙️ Do the speaking task</button><button class="btn wr">✍️ Do the writing task</button></div></div>' +
      '<div class="card"><h3>Weekly cycle</h3><div id="wk"></div></div>';
    host.querySelector(".sp").onclick = function () { practiceTask(d.speaking, ["substantial difference", "proportionality", "learning outcome", "duration"], ["q_qa", "q_recognition"]); };
    host.querySelector(".wr").onclick = function () { window.ELH.nav("qdecision"); toast("Use the 'Request for additional documents' template.", ""); };
    var todayName = ["Sunday", "Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday"][new Date().getDay()];
    var wk = host.querySelector("#wk");
    Q.WEEK.forEach(function (w) {
      var r = el("div", { class: "flex between", style: "padding:8px 0;border-bottom:1px dashed var(--border)" });
      r.innerHTML = '<span><b' + (w.day === todayName ? ' style="color:var(--navy-500)"' : '') + '>' + esc(w.day) + '</b> — ' + esc(w.theme) + '<div class="small muted">' + esc(w.focus) + '</div></span><button class="btn sm" data-go="' + w.view + '">Open</button>';
      wk.appendChild(r);
    });
    go(host);
  }

  /* ---------- Knowledge Feed ---------- */
  function vFeed(host) {
    var Qq = qs(); if (!Qq.feed) Qq.feed = { items: Q.FEED_SAMPLES.slice(), fetched: todayStr() };
    host.innerHTML = head("Qualifications Knowledge Feed", "Reputable recognition & qualifications updates turned into micro-lessons.",
      '<button class="btn primary" id="qf-refresh">🔄 Refresh</button>') +
      '<div class="card mb"><div class="small muted">Cached sample content (fetched ' + esc(Qq.feed.fetched) + '). Add live RSS/API sources in the main Settings page; see README for the CORS proxy. Prioritise UNESCO, ENIC-NARIC, the European Commission and OECD.</div></div>' +
      '<div class="grid auto" id="qfl"></div>';
    host.querySelector("#qf-refresh").onclick = function () { Qq.feed.items = shuffle(Q.FEED_SAMPLES.slice()); Qq.feed.fetched = todayStr(); window.ELH.save(); window.ELH.nav("qfeed"); toast("Feed refreshed (cached).", ""); };
    var l = host.querySelector("#qfl");
    Qq.feed.items.forEach(function (it) {
      var d = el("div", { class: "card" });
      d.innerHTML = '<div class="flex between"><span class="tag new">' + esc(it.source) + '</span><span class="small faint">' + esc(it.date) + '</span></div><h3 style="margin-top:8px">' + esc(it.title) + '</h3><div class="small muted">' + esc(it.summary) + '</div><div class="small mt"><b>Terms:</b> ' + it.terms.map(function (t) { return '<span class="tag">' + esc(t) + '</span>'; }).join(" ") + '</div><div class="btn-row mt"><button class="btn sm ml">📖 Micro-lesson</button><a class="btn sm" href="' + esc(it.link) + '" target="_blank" rel="noopener">Source ↗</a></div>';
      d.querySelector(".ml").onclick = function () { feedLesson(it); };
      l.appendChild(d);
    });
  }
  function feedLesson(it) {
    modal('<div class="tag new">' + esc(it.source) + '</div><h2>' + esc(it.title) + '</h2>' +
      '<div class="small"><b>Professional summary.</b> ' + esc(it.summary) + '</div>' +
      '<div class="small mt"><b>Five key terms.</b> ' + it.terms.map(function (t) { return '<span class="tag">' + esc(t) + '</span>'; }).join(" ") + '</div>' +
      '<div class="small mt"><b>Three phrases.</b><ul style="margin:4px 0 0 18px">' + it.phrases.map(function (p) { return "<li>“" + esc(p) + "”</li>"; }).join("") + '</ul></div>' +
      '<div class="small mt"><b>Policy question.</b> ' + esc(it.question) + '</div>' +
      '<div class="small mt"><b>Compare with your context.</b> How does this compare with your national system?</div>' +
      '<div class="small mt"><b>60-second speaking challenge.</b> ' + esc(it.task) + '</div>' +
      '<div class="btn-row mt2"><button class="btn primary" id="fl-sp">🎙️ Do the challenge</button><button class="btn" id="fl-c">Close</button></div>');
    document.getElementById("fl-c").onclick = closeModal;
    document.getElementById("fl-sp").onclick = function () { closeModal(); practiceTask(it.task, it.terms, ["q_qa", "q_system_vocab"]); };
    qRecord(75, ["q_system_vocab", "q_recognition"], it.title);
  }

  /* ---------- Monthly Assessment ---------- */
  function vAssessment(host) {
    host.innerHTML = head("Monthly Qualifications Assessment", "Eight components across terminology, comparison, framework, cases, decisions, negotiation, presentation and difficult questions.") +
      '<div class="card mb"><h3>Components</h3><div class="small">' +
      [["Terminology test", "qterms"], ["Concept comparison", "qcompare"], ["NQF explanation", "qnqf"], ["Recognition case analysis", "qcases"], ["Recognition decision writing", "qdecision"], ["Negotiation simulation", "qneg"], ["Five-minute presentation", "qpresent"], ["Difficult-question response", "qdiff"]].map(function (r, i) { return '<div class="flex between" style="padding:6px 0;border-bottom:1px dashed var(--border)"><span>' + (i + 1) + '. ' + esc(r[0]) + '</span><button class="btn sm" data-go="' + r[1] + '">Open</button></div>'; }).join("") + '</div>' +
      '<button class="btn primary block mt" id="ma-run">Generate assessment report</button></div>' +
      '<div class="card"><h3>How scoring works</h3><p class="small muted">Your report aggregates your qualifications competencies into a professional profile: strongest and weakest areas, recurring gaps, mastered terms and a targeted 30-day plan.</p></div>';
    go(host);
    host.querySelector("#ma-run").onclick = function () {
      var ind = qs().ind, prof = proficiency();
      modal('<h2>Monthly Report — ' + todayStr() + '</h2><div class="badge-score mb">Proficiency Index ' + prof + '/100</div>' +
        Q.INDICATORS.map(function (i) { return '<div class="indicator-row"><span class="name">' + esc(i.name) + '</span>' + bar(ind[i.key].current) + '<span class="val">' + ind[i.key].current + '</span></div>'; }).join("") +
        '<div class="divider"></div><div class="small"><b>Strongest:</b> ' + esc(strongest(1)[0].name) + '</div><div class="small"><b>Weakest:</b> ' + esc(weakest(1)[0].name) + '</div>' +
        '<div class="small mt"><b>Mastered terms:</b> ' + masteredCount() + ' / ' + Q.TERMS.length + '</div>' +
        '<div class="small mt"><b>Targeted 30-day plan:</b> Prioritise ' + weakest(3).map(function (x) { return esc(x.name); }).join(", ") + '. Do one recognition case and one decision letter per week; review 10 terms daily.</div>' +
        '<div class="btn-row mt2"><button class="btn primary" id="ma-print">🖨 Export report</button><button class="btn" id="ma-c">Close</button></div>');
      document.getElementById("ma-c").onclick = closeModal;
      document.getElementById("ma-print").onclick = function () {
        window.ELH.exportPrint("Qualifications English — Monthly Report " + todayStr(),
          "Proficiency Index: " + prof + "/100\n\n" + Q.INDICATORS.map(function (i) { return "  " + i.name + ": " + ind[i.key].current; }).join("\n") +
          "\n\nStrongest: " + strongest(1)[0].name + "\nWeakest: " + weakest(1)[0].name + "\nMastered terms: " + masteredCount() + "/" + Q.TERMS.length);
      };
      qRecord(prof, ["q_qa"], "monthly assessment");
    };
  }

})();

</script>
</body>
</html>
